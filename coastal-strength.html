    --line: #1E3A4E; --line-strong: #2C4C63; --field: #0E2230; --tint: rgba(63,189,178,.14); --sand-tint: rgba(217,190,132,.14);
  }
}
:root[data-theme="dark"] {
  --surface: #0A1922; --card: #12293A; --ink: #F2EFE9; --muted: #9AAAB6;
  --accent: #3FBDB2; --accent-ink: #061A1C; --sand: #D9BE84; --danger: #D9705E;
  --line: #1E3A4E; --line-strong: #2C4C63; --field: #0E2230; --tint: rgba(63,189,178,.14); --sand-tint: rgba(217,190,132,.14);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--surface); color: var(--ink); }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.4;
  font-variant-numeric: tabular-nums lining-nums;
  min-height: 100dvh; overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; font-variant-numeric: tabular-nums lining-nums; }
button { cursor: pointer; }
a { color: var(--accent); }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: 24px; } h2 { font-size: 18px; } h3 { font-size: 16px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 12px; }
.num { font-variant-numeric: tabular-nums lining-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { max-width: 480px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
.screen {
  flex: 1; padding: calc(12px + env(safe-area-inset-top)) 16px calc(var(--tab-h) + 24px + env(safe-area-inset-bottom));
  width: 100%; overflow-x: hidden;
}
.screen.no-tabs { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.screen.has-timer { padding-bottom: calc(var(--tab-h) + 96px + env(safe-area-inset-bottom)); }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; min-height: 36px; }
.topbar .brand { display: flex; align-items: center; gap: 10px; }
.topbar .brand svg { width: 26px; height: 26px; flex: none; }
.status { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
.status.saved::before { background: var(--accent); }
.status.saving::before, .status.dirty::before { background: var(--sand); }
.status.error::before, .status.unavailable::before { background: var(--danger); }

.stack > * + * { margin-top: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.card.flat { background: transparent; border-style: dashed; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line-strong);
  background: var(--card); color: var(--ink); font-weight: 600; font-size: 16px; text-decoration: none;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.block { width: 100%; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--accent); padding: 0 10px; }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.danger.solid { background: var(--danger); color: #fff; }
.btn.sm { min-height: 40px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.xs { min-height: 34px; padding: 0 10px; font-size: 13px; border-radius: 9px; font-weight: 500; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.icon { width: 44px; min-width: 44px; padding: 0; }
.link { background: none; border: 0; color: var(--accent); padding: 4px 0; font-weight: 500; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; color: var(--muted); }
.input, select.input, textarea.input {
  width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line-strong);
  background: var(--field); color: var(--ink); font-size: 17px; outline: none;
}
textarea.input { min-height: 80px; resize: vertical; }
.input:focus, select.input:focus, textarea.input:focus, .btn:focus-visible, .chip:focus-visible, .tab:focus-visible, .setcheck:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}
.input.invalid { border-color: var(--danger); }
.help { font-size: 13px; color: var(--muted); }
.error { font-size: 13px; color: var(--danger); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--card);
  font-size: 15px; display: inline-flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"], .chip.on { background: var(--tint); border-color: var(--accent); color: var(--ink); }
.chip.sm { min-height: 34px; padding: 0 11px; font-size: 14px; }

/* Tabs */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabs .inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tab-h); }
.tab { background: none; border: 0; color: var(--muted); font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] svg { color: var(--accent); }

/* Rest timer bar */
.timerbar {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom)); z-index: 19;
  background: var(--card); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.timerbar .inner { max-width: 480px; margin: 0 auto; padding: 10px 12px; display: flex; align-items: center; gap: 8px; }
.timerbar .clock { font-size: 26px; font-weight: 600; min-width: 74px; }
.timerbar.done .clock { color: var(--accent); }
.timerbar .bar { position: absolute; left: 0; top: 0; height: 3px; background: var(--accent); }

/* Today */
.session-card .name { font-size: 24px; font-weight: 600; }
.ring { display: flex; align-items: center; gap: 16px; }
.ring svg { width: 72px; height: 72px; flex: none; }
.ring .big { font-size: 24px; font-weight: 600; }
.daydots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 12px; }
.daydot { text-align: center; font-size: 11px; color: var(--muted); }
.daydot i { display: block; width: 10px; height: 10px; border-radius: 50%; margin: 0 auto 4px; border: 1.5px solid var(--line-strong); background: transparent; }
.daydot.lift i { border-color: var(--ink); }
.daydot.done i { background: var(--accent); border-color: var(--accent); }
.daydot.today span { color: var(--ink); font-weight: 600; }
.daydot.other i { border-style: dotted; }
.weightline { font-size: 24px; font-weight: 600; }

/* Train list */
.weekrow { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.weekrow:first-child { border-top: 0; }
.weekrow .day { font-weight: 600; }
.weekrow.today .day { color: var(--accent); }
.pill { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--tint); color: var(--ink); }
.pill.done { background: var(--accent); color: var(--accent-ink); }
.pill.muted { background: transparent; border: 1px solid var(--line-strong); color: var(--muted); }

/* Logger */
.logger-head { position: sticky; top: 0; z-index: 5; background: var(--surface); padding: 6px 0 8px; margin: -6px 0 6px; }
.elapsed { font-size: 20px; font-weight: 600; }
.excard { padding: 12px 12px 10px; }
.excard .exhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.excard .exname { font-size: 17px; font-weight: 600; }
.excard .exmeta { font-size: 13px; color: var(--muted); margin-top: 2px; }
.excard.skipped { opacity: .6; }
.lastline { font-size: 13px; color: var(--muted); margin-top: 8px; }
.sugg { margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: var(--sand-tint); font-size: 14px; }
.sets { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.sethead { display: grid; grid-template-columns: 38px 1fr 1fr 44px 52px; gap: 6px; font-size: 11px; color: var(--muted); padding: 0 2px; }
.setrow { display: grid; grid-template-columns: 38px 1fr 1fr 44px 52px; gap: 6px; align-items: center; border-radius: 12px; padding: 4px 2px; border-left: 3px solid transparent; }
.setrow.done { border-left-color: var(--accent); background: var(--tint); }
.setrow.warm .setlabel { color: var(--muted); }
.setlabel { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.1; }
.setlabel b { display: block; font-size: 15px; color: var(--ink); font-weight: 600; }
.setinput {
  width: 100%; min-height: 50px; padding: 0 6px; text-align: center; font-size: 22px; font-weight: 600; border-radius: 10px;
  border: 1px solid var(--line-strong); background: var(--field); color: var(--ink);
}
.setinput.rir { font-size: 16px; font-weight: 500; }
.setinput.prefilled { color: var(--muted); font-weight: 500; }
.setinput.invalid { border-color: var(--danger); }
.setinput::placeholder { color: var(--line-strong); font-weight: 400; }
.setcheck {
  width: 52px; height: 50px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--card);
  display: inline-flex; align-items: center; justify-content: center; color: var(--muted);
}
.setcheck svg { width: 26px; height: 26px; }
.setcheck.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.setactions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.convention { font-size: 11px; color: var(--muted); text-align: center; margin-top: -2px; }
.rangebar { position: relative; height: 6px; border-radius: 3px; background: var(--line); margin: 8px 0 2px; }
.rangebar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
.rangebar .tick { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--muted); }

/* Sheets */
.sheet-back { position: fixed; inset: 0; background: rgba(6, 20, 28, .45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; background: var(--card); border-radius: 18px 18px 0 0; padding: 14px 16px calc(20px + env(safe-area-inset-bottom)); max-height: 88dvh; overflow-y: auto; }
.sheet h2 { margin-bottom: 8px; }
.sheet .list > * { display: flex; width: 100%; text-align: left; padding: 14px 4px; background: none; border: 0; border-top: 1px solid var(--line); font-size: 16px; color: var(--ink); align-items: center; justify-content: space-between; gap: 8px; }
.sheet .list > *:first-child { border-top: 0; }
.sheet .list .danger { color: var(--danger); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: 10px; font-size: 14px; z-index: 50; max-width: 90vw; }

/* Summary */
.summ .stat { font-size: 26px; font-weight: 600; }
.summ .cmp { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 12px; font-size: 14px; align-items: baseline; }
.summ .cmp .h { color: var(--muted); font-size: 12px; }
.reasons { margin: 8px 0 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
.reasons li + li { margin-top: 4px; }
.pr { color: var(--sand); font-weight: 600; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale .chip { justify-content: center; padding: 0; min-height: 44px; }

/* Onboarding */
.ob .step { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.ob h1 { margin-bottom: 4px; }
.ob .lead { color: var(--muted); margin-bottom: 18px; }
.ob .actions { position: sticky; bottom: 0; padding: 12px 0 calc(8px + env(safe-area-inset-bottom)); background: var(--surface); margin-top: 20px; display: flex; gap: 10px; }
.ob .actions .btn.primary { flex: 1; }
.leverage { padding-left: 18px; margin: 10px 0 0; }
.leverage li + li { margin-top: 8px; }

/* Placeholder screens */
.later { padding: 28px 16px; text-align: left; }

/* Empty state */
.empty { color: var(--muted); padding: 8px 0; }

/* Progress list */
.exlist button { display: flex; justify-content: space-between; align-items: center; width: 100%; background: none; border: 0; border-top: 1px solid var(--line); padding: 13px 2px; text-align: left; color: var(--ink); font-size: 16px; }
.exlist button:first-child { border-top: 0; }

@media (prefers-reduced-motion: no-preference) {
  .setcheck, .chip, .btn { transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
  .sheet { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(12px); opacity: .6; } to { transform: none; opacity: 1; } }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
@media (min-width: 481px) { .screen { padding-left: 20px; padding-right: 20px; } }

<script>
/* ===== core/util.js ===== */
/* Coastal Strength — core/util.js
   Plain-script module. Attaches to window.CS.util. No DOM access. */
(function () {
  const CS = (window.CS = window.CS || {});
  const U = {};

  U.uid = function (prefix) {
    return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9);
  };

  U.defaultTz = function () {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (e) { return 'UTC'; }
  };

  const fmtCache = {};
  function fmtFor(tz) {
    if (fmtCache[tz]) return fmtCache[tz];
    let f;
    try {
      f = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' });
    } catch (e) {
      f = new Intl.DateTimeFormat('en-CA', { year: 'numeric', month: '2-digit', day: '2-digit' });
    }
    fmtCache[tz] = f;
    return f;
  }

  /* Local calendar date (YYYY-MM-DD) for an instant, in the given IANA zone.
     Schedules and daily logs key off this; timestamps stay UTC ISO. */
  U.localDate = function (ts, tz) {
    const d = ts instanceof Date ? ts : new Date(ts);
    const parts = fmtFor(tz || U.defaultTz()).formatToParts(d);
    const get = (t) => parts.find((p) => p.type === t).value;
    return get('year') + '-' + get('month') + '-' + get('day');
  };

  U.WEEKDAYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
  U.WEEKDAY_LABEL = { mon: 'Monday', tue: 'Tuesday', wed: 'Wednesday', thu: 'Thursday', fri: 'Friday', sat: 'Saturday', sun: 'Sunday' };
  U.WEEKDAY_SHORT = { mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat', sun: 'Sun' };

  function split(localDate) {
    const p = localDate.split('-').map(Number);
    return { y: p[0], m: p[1], d: p[2] };
  }

  U.isLocalDate = function (s) {
    return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  };

  U.weekday = function (localDate) {
    const { y, m, d } = split(localDate);
    const dow = new Date(Date.UTC(y, m - 1, d)).getUTCDay(); // 0 = Sunday
    return U.WEEKDAYS[(dow + 6) % 7];
  };

  U.addDays = function (localDate, n) {
    const { y, m, d } = split(localDate);
    return new Date(Date.UTC(y, m - 1, d) + n * 86400000).toISOString().slice(0, 10);
  };

  U.diffDays = function (a, b) {
    const A = split(a), B = split(b);
    return Math.round((Date.UTC(B.y, B.m - 1, B.d) - Date.UTC(A.y, A.m - 1, A.d)) / 86400000);
  };

  /* Monday-start weeks. */
  U.weekStart = function (localDate) {
    return U.addDays(localDate, -U.WEEKDAYS.indexOf(U.weekday(localDate)));
  };

  U.weekDates = function (localDate) {
    const s = U.weekStart(localDate);
    return U.WEEKDAYS.map((key, i) => ({ key, date: U.addDays(s, i) }));
  };

  U.fmtLocalDate = function (localDate, opts) {
    const { y, m, d } = split(localDate);
    const dt = new Date(Date.UTC(y, m - 1, d));
    const o = Object.assign({ month: 'short', day: 'numeric', timeZone: 'UTC' }, opts || {});
    return new Intl.DateTimeFormat('en-US', o).format(dt);
  };

  /* Units */
  U.LB_PER_KG = 2.2046226218;
  U.toUnit = function (value, from, to) {
    if (value == null || from === to) return value;
    return from === 'lb' ? value / U.LB_PER_KG : value * U.LB_PER_KG;
  };
  U.fmtNum = function (n, maxDecimals) {
    if (n == null || isNaN(n)) return '—';
    const md = maxDecimals == null ? 2 : maxDecimals;
    const r = Math.round(n * Math.pow(10, md)) / Math.pow(10, md);
    return String(r);
  };
  U.fmtLoad = function (n) { return U.fmtNum(n, 2); };

  /* Parse a numeric input. Returns { value, error }.
     Empty -> null value with no error. Negative -> error. */
  U.parseNum = function (raw, opts) {
    opts = opts || {};
    if (raw == null) return { value: null };
    const s = String(raw).trim().replace(',', '.');
    if (s === '') return { value: null };
    if (!/^-?\d*(\.\d*)?$/.test(s) || s === '-' || s === '.') return { value: null, error: 'Enter a number.' };
    const v = Number(s);
    if (isNaN(v)) return { value: null, error: 'Enter a number.' };
    if (v < 0) return { value: null, error: "Can't be negative." };
    if (opts.integer && Math.round(v) !== v) return { value: null, error: 'Whole numbers only.' };
    if (opts.max != null && v > opts.max) return { value: null, error: 'Too large.' };
    return { value: v };
  };

  U.fmtDuration = function (ms) {
    if (ms == null || ms < 0) ms = 0;
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const pad = (n) => (n < 10 ? '0' + n : '' + n);
    return h > 0 ? h + ':' + pad(m) + ':' + pad(sec) : m + ':' + pad(sec);
  };

  U.fmtClock = function (sec) {
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  };

  U.clone = function (o) { return JSON.parse(JSON.stringify(o)); };

  U.mean = function (arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null; };

  CS.util = U;
})();


/* ===== core/plan.js ===== */
/* Coastal Strength — core/plan.js
   Exercise catalogue + default plan template (spec §6, seeded exactly). */
(function () {
  const CS = (window.CS = window.CS || {});

  /* Exercise types and load conventions — modelled explicitly, never flattened.
     type:           dumbbell | barbell | machine | cable | bodyweight | assisted | weighted_bw | timed
     loadConvention: per_dumbbell | total_bar | machine_stack | none | assistance | added
     Increments are per exercise and per unit; editable later in Profile (not yet built). */
  function ex(id, name, type, opts) {
    const conv = {
      dumbbell: 'per_dumbbell', barbell: 'total_bar', machine: 'machine_stack', cable: 'machine_stack',
      bodyweight: 'none', assisted: 'assistance', weighted_bw: 'added', timed: 'none'
    }[type];
    return Object.assign({
      id, name, type, loadConvention: conv,
      unilateral: false, compound: false, priority: false,
      incrementLb: type === 'dumbbell' ? 5 : type === 'barbell' ? 5 : 5,
      incrementKg: 2.5,
      cues: '',
      family: null // shared substitution family
    }, opts || {});
  }

  const EXERCISES = [
    // Push
    ex('inc_db_press', 'Incline dumbbell press', 'dumbbell', { compound: true, priority: true, family: 'press_incline', cues: 'Bench 30°. Dumbbells start at chest level, press up and slightly in.' }),
    ex('flat_mach_press', 'Flat machine press', 'machine', { compound: true, family: 'press_flat', cues: 'Handles at mid-chest. Full range, no lockout slam.' }),
    ex('flat_db_press', 'Flat dumbbell press', 'dumbbell', { compound: true, family: 'press_flat' }),
    ex('seated_db_ohp', 'Seated dumbbell shoulder press', 'dumbbell', { compound: true, family: 'ohp', cues: 'Back supported. Press to lockout, control down to ear level.' }),
    ex('cable_lat_raise', 'Cable lateral raises', 'cable', { priority: true, unilateral: true, family: 'lat_raise', incrementLb: 2.5, incrementKg: 1, cues: 'Lead with the elbow. Stop at shoulder height.' }),
    ex('rope_pushdown', 'Rope triceps pushdowns', 'cable', { family: 'pushdown', cues: 'Elbows pinned. Spread the rope at the bottom.' }),
    ex('oh_cable_ext', 'Overhead cable extensions', 'cable', { family: 'oh_ext', cues: 'Full stretch at the bottom, elbows stay forward.' }),
    // Pull

/* Coastal Strength — core/db.js

(function () {

  const D = {};

  D.SCHEMA_VERSION = 1;

  /* ---------- creation ---------- */

  D.createInitial = function (input, nowIso) {
    nowIso = nowIso || new Date().toISOString();
    const tz = input.timezone || U.defaultTz();
    const planId = U.uid('plan');
    const db = {
      schemaVersion: D.SCHEMA_VERSION,
      createdAt: nowIso,
      profile: {
        name: input.name || '',
        heightIn: input.heightIn == null ? null : input.heightIn,
        units: input.units === 'kg' ? 'kg' : 'lb',
        timezone: tz,
        schedule: Object.assign({}, P.DEFAULT_SCHEDULE, input.schedule || {}),
        equipment: input.equipment || {},
        picks: Object.assign({}, input.picks || {}),
        nutritionMode: input.nutritionMode || 'undecided',
        calorieTarget: input.calorieTarget == null ? null : input.calorieTarget,
        experience: input.experience || '',
        limitations: input.limitations || '',
        frameNoteShown: !!input.frameNoteShown,
        onboarded: true
      },
      exercises: U.clone(P.EXERCISE_MAP),
      planVersions: [{ id: planId, version: 1, createdAt: nowIso, note: 'Default plan', templates: U.clone(P.DEFAULT_TEMPLATES) }],
      activePlanVersionId: planId,
      sessions: {},
      sessionOrder: [],
      measurements: [],
      cardioSessions: [],
      recoveryLogs: {},
      nutrition: { days: {}, savedFoods: [] },
      suggestions: {},
      timer: null,
      settings: {
        restDefaults: Object.assign({}, P.REST_DEFAULTS),
        autoStartRest: true,
        restSound: true,
        restVibrate: true,
        theme: 'auto'
      }
    };
    // Default picks: first option of every OR slot unless the user chose.
    P.OR_SLOTS.forEach((s) => { if (!db.profile.picks[s.slotId]) db.profile.picks[s.slotId] = s.options[0]; });
    if (input.weight != null) {
      D.addMeasurement(db, { type: 'weight', value: input.weight, unit: input.weightUnit || db.profile.units, localDate: input.weightDate || U.localDate(nowIso, tz) }, nowIso);
    }
    return db;
  };

  /* ---------- lookups ---------- */

  D.activePlan = function (db) {
    return db.planVersions.find((p) => p.id === db.activePlanVersionId) || db.planVersions[db.planVersions.length - 1];
  };

  D.templateForWeekday = function (db, weekday) {
    const plan = D.activePlan(db);
    const tid = Object.keys(db.profile.schedule).find((t) => db.profile.schedule[t] === weekday && plan.templates[t]);
    return tid ? plan.templates[tid] : { id: 'rest', name: 'Rest', kind: 'rest' };
  };

  D.exercise = function (db, id) { return db.exercises[id] || P.EXERCISE_MAP[id] || null; };

  D.sessionList = function (db) { return db.sessionOrder.map((id) => db.sessions[id]).filter(Boolean); };

  D.sessionsOn = function (db, localDate) { return D.sessionList(db).filter((s) => s.localDate === localDate); };

  D.findActiveSession = function (db) {
    return D.sessionList(db).find((s) => s.status === 'in_progress' || s.status === 'paused') || null;
  };

  D.sessionFor = function (db, templateId, localDate) {
    return D.sessionList(db).find((s) => s.templateId === templateId && s.localDate === localDate) || null;
  };

  /* Most recent session where this exercise had at least one completed working set.

  D.lastPerformance = function (db, exerciseId, excludeSessionId) {
    const list = D.sessionList(db);
    for (let i = list.length - 1; i >= 0; i--) {
      const s = list[i];
      if (s.id === excludeSessionId) continue;
      for (const inst of s.exercises || []) {
        if (inst.exerciseId !== exerciseId || inst.skipped) continue;
        const sets = D.logicalSets(inst, { completedOnly: true, kind: 'working' });
        if (sets.length) return { sessionId: s.id, localDate: s.localDate, sets, prescription: inst.prescription, sidesSeparate: !!inst.sidesSeparate };
      }
    }
    return null;
  };

  /* Pending progression decision for this exercise that has not yet been applied to a session. */
  D.pendingSuggestion = function (db, exerciseId) {
    const all = Object.values(db.suggestions).filter((s) => s.exerciseId === exerciseId && !s.consumedBy);
    all.sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
    return all[0] || null;
  };

  /* ---------- logical sets (unilateral pairs collapse to one) ---------- */

  D.logicalSets = function (inst, opts) {
    opts = opts || {};
    const kind = opts.kind || null;
    const sets = (inst.sets || []).filter((s) => !kind || s.kind === kind);
    const out = [];
    const seen = {};
    for (const s of sets) {
      if (s.side === 'both' || !s.pairId) {
        out.push({ setIds: [s.id], load: s.load, unit: s.unit, reps: s.reps, durationSec: s.durationSec, rir: s.rir, completed: !!s.completed, mixedLoad: false, kind: s.kind, sides: null, notes: s.notes });
      } else {
        if (seen[s.pairId]) continue;
        seen[s.pairId] = true;
        const pair = sets.filter((x) => x.pairId === s.pairId);
        const L = pair.find((x) => x.side === 'L') || null, R = pair.find((x) => x.side === 'R') || null;
        const both = [L, R].filter(Boolean);
        const loads = both.map((x) => x.load);
        const mixed = loads.length > 1 && !(loads[0] === loads[1]);
        const reps = both.every((x) => x.reps != null) ? Math.min.apply(null, both.map((x) => x.reps)) : null;
        const durs = both.filter((x) => x.durationSec != null).map((x) => x.durationSec);
        const rirs = both.filter((x) => x.rir != null).map((x) => x.rir);
        out.push({
          setIds: both.map((x) => x.id), load: mixed ? null : loads[0], unit: both[0].unit,
          reps: both.length === 2 ? reps : both[0].reps,
          durationSec: durs.length ? Math.min.apply(null, durs) : null,
          rir: rirs.length ? Math.min.apply(null, rirs) : null,
          completed: both.length === 2 && both.every((x) => x.completed), mixedLoad: mixed, kind: s.kind,

  function newSet(exercise, unit, base, kind) {

      load: base && base.load != null ? base.load : null,
      unit: unit,
      reps: base && base.reps != null ? base.reps : null,
      durationSec: base && base.durationSec != null ? base.durationSec : null,
      rir: null, completed: false, completedAt: null,
      prefilled: !!(base && (base.load != null || base.reps != null || base.durationSec != null)),

    const sets = [];
    for (let i = 0; i < prescription.sets; i++) {

      if (last) {

  D.createSession = function (db, templateId, localDate, nowIso) {
    const plan = D.activePlan(db);
    const t = plan.templates[templateId];
    if (!t) throw new Error('Unknown template ' + templateId);
    const id = U.uid('sess');
    const session = {
      id, templateId, templateName: t.name, kind: t.kind, planVersionId: plan.id,

      status: 'planned', createdAt: nowIso, startedAt: null, finishedAt: null, segments: [],

      const exId = db.profile.picks[slot.slotId] && slot.options.indexOf(db.profile.picks[slot.slotId]) >= 0 ? db.profile.picks[slot.slotId] : slot.options[0];
      const ex = D.exercise(db, exId);
      const prescription = { sets: slot.sets, repMin: slot.repMin, repMax: slot.repMax, perSide: !!slot.perSide, timed: slot.timed ? U.clone(slot.timed) : null };

    s.status = 'paused';

  D.resumeSession = function (db, sid, nowIso) {

    if (!s || s.status !== 'paused') return;
    s.segments.push({ start: nowIso, end: null });
    s.status = 'in_progress';

    (s.segments || []).forEach((g) => {

    return set.completed;
  };

  D.addSet = function (db, sid, iid, kind) {
    const inst = findInst(db, sid, iid);
    if (!inst) return;
    const ex = D.exercise(db, inst.exerciseId);
    const unit = db.profile.units;
    const lastWorking = inst.sets.slice().reverse().find((s) => s.kind === 'working');
    const base = lastWorking ? { load: lastWorking.load, reps: lastWorking.reps, durationSec: lastWorking.durationSec } : null;
    if (inst.sidesSeparate) {
      const pairId = U.uid('pair');
      const a = newSet(ex, unit, base, kind); a.side = 'L'; a.pairId = pairId;
      const b = newSet(ex, unit, base, kind); b.side = 'R'; b.pairId = pairId;
      a.prefilled = b.prefilled = false;
      inst.sets.push(a, b);
      return a.id;
    }
    const s = newSet(ex, unit, base, kind);
    s.prefilled = false;
    if (kind === 'warmup') {
      const firstWorking = inst.sets.findIndex((x) => x.kind === 'working');
      inst.sets.splice(firstWorking < 0 ? inst.sets.length : firstWorking, 0, s);
    } else inst.sets.push(s);
    return s.id;
  };

  D.deleteSet = function (db, sid, iid, setId) {
    const inst = findInst(db, sid, iid);
    if (!inst) return;
    const set = inst.sets.find((x) => x.id === setId);
    if (!set) return;
    inst.sets = inst.sets.filter((x) => (set.pairId ? x.pairId !== set.pairId : x.id !== setId));
  };

  D.setKind = function (db, sid, iid, setId, kind) {
    const inst = findInst(db, sid, iid);
    if (!inst) return;
    const set = inst.sets.find((x) => x.id === setId);
    if (!set) return;
    const targets = set.pairId ? inst.sets.filter((x) => x.pairId === set.pairId) : [set];
    targets.forEach((t) => { t.kind = kind; });
  };

  /* Switch a unilateral exercise between linked (one row = both sides) and separate L/R rows. */
  D.setSidesSeparate = function (db, sid, iid, separate) {
    const inst = findInst(db, sid, iid);
    if (!inst || !!inst.sidesSeparate === !!separate) return;
    const next = [];
    if (separate) {
      inst.sets.forEach((s) => {
        if (s.side !== 'both') { next.push(s); return; }
        const pairId = U.uid('pair');
        const L = Object.assign({}, s, { id: U.uid('set'), side: 'L', pairId });
        const R = Object.assign({}, s, { id: U.uid('set'), side: 'R', pairId });
        next.push(L, R);
      });
    } else {
      const seen = {};
      inst.sets.forEach((s) => {
        if (s.side === 'both' || !s.pairId) { next.push(s); return; }
        if (seen[s.pairId]) return;
        seen[s.pairId] = true;
        const pair = inst.sets.filter((x) => x.pairId === s.pairId);
        const both = pair.every((x) => x.completed);
        const merged = Object.assign({}, pair[0], { id: U.uid('set'), side: 'both', pairId: null, completed: both, completedAt: both ? pair[0].completedAt : null });
        if (pair.length === 2 && pair[0].reps != null && pair[1].reps != null) merged.reps = Math.min(pair[0].reps, pair[1].reps);
        next.push(merged);
      });
    }
    inst.sets = next;
    inst.sidesSeparate = !!separate;
  };

  D.skipExercise = function (db, sid, iid, reason) {
    const inst = findInst(db, sid, iid);
    if (!inst) return;
    inst.skipped = true;
    inst.skipReason = reason || '';
  };

  D.unskipExercise = function (db, sid, iid) {
    const inst = findInst(db, sid, iid);
    if (!inst) return;
    inst.skipped = false;
    inst.skipReason = '';
  };

  /* Substitution keeps separate histories: the new exercise prefills from ITS own history. */
  D.substituteExercise = function (db, sid, iid, newExerciseId) {
    const inst = findInst(db, sid, iid);
    const ex = D.exercise(db, newExerciseId);
    if (!inst || !ex) return;
    const anyDone = inst.sets.some((s) => s.completed);
    if (anyDone) return false; // never rewrite logged work
    inst.substitutedFrom = inst.substitutedFrom || inst.exerciseId;
    inst.exerciseId = newExerciseId;
    const built = D.buildSets(db, ex, inst.prescription, sid);
    inst.sets = built.sets;
    inst.sidesSeparate = false;
    inst.lastPerformance = built.last ? { sessionId: built.last.sessionId, localDate: built.last.localDate, sets: built.last.sets.map((s) => ({ load: s.load, unit: s.unit, reps: s.reps, durationSec: s.durationSec })) } : null;
    inst.restSec = ex.compound ? db.settings.restDefaults.compound : db.settings.restDefaults.isolation;
    if (built.suggestion) built.suggestion.consumedBy = sid;
    return true;
  };

  D.moveExercise = function (db, sid, iid, dir) {
    const s = db.sessions[sid];
    if (!s) return;
    const i = s.exercises.findIndex((e) => e.instanceId === iid);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= s.exercises.length) return;
    const tmp = s.exercises[i]; s.exercises[i] = s.exercises[j]; s.exercises[j] = tmp;
    s.exercises.forEach((e, k) => { e.order = k; });
  };

  D.setInstanceField = function (db, sid, iid, field, value) {
    const inst = findInst(db, sid, iid);
    if (!inst) return;
    if (['notes', 'restSec'].indexOf(field) < 0) return;
    inst[field] = value;
  };

  D.setSessionField = function (db, sid, field, value) {
    const s = db.sessions[sid];
    if (!s) return;
    if (['notes', 'energy', 'difficulty', 'soreness'].indexOf(field) < 0) return;
    s[field] = value;
  };

  /* ---------- counts (completed only — prefilled never counts) ---------- */

  D.counts = function (session) {
    let workingDone = 0, workingPrescribed = 0, exercisesDone = 0, exercisesTotal = 0, warmupsDone = 0;
    (session.exercises || []).forEach((inst) => {
      if (inst.skipped) return;
      exercisesTotal++;
      const done = D.logicalSets(inst, { completedOnly: true, kind: 'working' }).length;
      workingDone += done;
      workingPrescribed += inst.prescription.sets;
      warmupsDone += D.logicalSets(inst, { completedOnly: true, kind: 'warmup' }).length;
      if (done >= inst.prescription.sets) exercisesDone++;
    });
    return { workingDone, workingPrescribed, exercisesDone, exercisesTotal, warmupsDone };
  };

  /* ---------- measurements ---------- */

  D.addMeasurement = function (db, m, nowIso) {
    const rec = { id: U.uid('meas'), type: m.type, value: m.value, unit: m.unit || null, localDate: m.localDate, createdAt: nowIso || new Date().toISOString(), note: m.note || '' };
    db.measurements.push(rec);
    return rec.id;
  };

  D.latestMeasurement = function (db, type) {
    const list = db.measurements.filter((m) => m.type === type).sort((a, b) => (a.localDate < b.localDate ? 1 : a.localDate > b.localDate ? -1 : (a.createdAt < b.createdAt ? 1 : -1)));
    return list[0] || null;
  };

  /* ---------- rest timer (timestamp based; persisted so it survives navigation and reload) ---------- */

  D.startRest = function (db, seconds, nowMs, sessionId) {
    db.timer = { kind: 'rest', startedAt: nowMs, endsAt: nowMs + seconds * 1000, durationSec: seconds, pausedAt: null, remainingMs: null, alerted: false, sessionId: sessionId || null };
  };
  D.adjustRest = function (db, deltaSec, nowMs) {
    const t = db.timer; if (!t) return;
    if (t.pausedAt != null) t.remainingMs = Math.max(0, t.remainingMs + deltaSec * 1000);
    else t.endsAt = Math.max(nowMs, t.endsAt + deltaSec * 1000);
    t.alerted = false;
  };
  D.pauseRest = function (db, nowMs) {
    const t = db.timer; if (!t || t.pausedAt != null) return;
    t.pausedAt = nowMs; t.remainingMs = Math.max(0, t.endsAt - nowMs);
  };
  D.resumeRest = function (db, nowMs) {
    const t = db.timer; if (!t || t.pausedAt == null) return;
    t.endsAt = nowMs + t.remainingMs; t.pausedAt = null; t.remainingMs = null;
  };
  D.dismissRest = function (db) { db.timer = null; };
  D.restState = function (db, nowMs) {
    const t = db.timer; if (!t) return null;
    const remainingMs = t.pausedAt != null ? t.remainingMs : t.endsAt - nowMs;
    return { remainingSec: Math.max(0, Math.ceil(remainingMs / 1000)), done: remainingMs <= 0, paused: t.pausedAt != null, durationSec: t.durationSec, alerted: t.alerted };
  };

  /* ---------- migrations ---------- */

  D.migrate = function (db) {
    if (!db || typeof db !== 'object') return null;
    if (!db.schemaVersion) db.schemaVersion = 1;
    // Future schema bumps go here, one step at a time.
    return db;
  };

  CS.db = D;
})();


/* ===== core/progression.js ===== */
/* Coastal Strength — core/progression.js
   Transparent double progression. Every result carries its exact reasons.
   Nothing here rewrites a workout; results are suggestions the user decides on. */
(function () {
  const CS = (window.CS = window.CS || {});
  const U = CS.util, D = CS.db;
  const PR = {};

  function loadLabel(ex) {
    return { per_dumbbell: 'per dumbbell', total_bar: 'total bar', machine_stack: 'on the stack', assistance: 'assistance', added: 'added', none: '' }[ex.loadConvention] || '';
  }

  /* evaluate({ exercise, instance, session, db }) ->
     { status, reasons[], currentLoad, suggestedLoad, increment, unit, rirFlag, rirNote, decline }
     status: increase | assist_decrease | bodyweight_top | timed_top | hold | none | not_evaluated */
  PR.evaluate = function (args) {
    const ex = args.exercise, inst = args.instance, s = args.session, db = args.db;
    const p = inst.prescription;
    const reasons = [];
    const unit = (inst.sets.find((x) => x.unit) || {}).unit || (db && db.profile.units) || 'lb';
    const inc = unit === 'kg' ? ex.incrementKg : ex.incrementLb;
    const base = { status: 'none', reasons, currentLoad: null, suggestedLoad: null, increment: inc, unit, rirFlag: false, rirNote: null, decline: null, exerciseName: ex.name };

    if (!s || s.status !== 'completed') {
      reasons.push('Session not finished. Increases are only evaluated for completed sessions.');
      return Object.assign(base, { status: 'not_evaluated' });
    }
    if (inst.skipped) {
      reasons.push('Exercise skipped this session.');
      return Object.assign(base, { status: 'not_evaluated' });
    }

    const done = D.logicalSets(inst, { completedOnly: true, kind: 'working' });
    reasons.push('Warm-up sets excluded. ' + done.length + ' of ' + p.sets + ' prescribed working sets completed.');
    if (done.length < p.sets) {
      reasons.push('Not every prescribed working set was completed, so no increase.');
      return base;
    }
    const evaluated = done.slice(0, p.sets);
    if (done.length > p.sets) reasons.push((done.length - p.sets) + ' extra set(s) logged; only the first ' + p.sets + ' prescribed sets are evaluated.');

    // RIR
    const rirLogged = evaluated.filter((x) => x.rir != null);
    const rirFlag = rirLogged.some((x) => x.rir <= 0);
    const rirNote = rirLogged.length ? null : 'RIR was not logged, so this used load and reps only.';
    base.rirFlag = rirFlag; base.rirNote = rirNote;

    // Timed holds
    if (ex.type === 'timed' && p.timed) {
      const top = evaluated.filter((x) => x.durationSec != null && x.durationSec >= p.timed.secMax).length;
      reasons.push(top + ' of ' + p.sets + ' holds reached ' + p.timed.secMax + ' s.');
      if (top < p.sets) { reasons.push('Progress toward ' + p.timed.secMax + ' s on every hold.'); return base; }
      reasons.push('Every hold reached the upper bound. Make the hold harder (e.g. feet elevated) or extend the target — your call.');
      return Object.assign(base, { status: 'timed_top' });
    }

    // Load consistency
    const loads = evaluated.map((x) => x.load);
    const usesLoad = ex.loadConvention !== 'none';
    if (usesLoad) {
      const distinct = {};
      loads.forEach((l) => { distinct[l == null ? 'none' : String(l)] = true; });
      const mixed = evaluated.some((x) => x.mixedLoad) || Object.keys(distinct).length > 1;
      if (mixed) {
        reasons.push('Sets used different loads (' + loads.map((l) => (l == null ? '—' : U.fmtLoad(l))).join(', ') + ' ' + unit + '). A blanket increase is never suggested for a mixed-load session.');
        return base;
      }
      if (loads[0] == null) {
        reasons.push('No load was logged, so no increase can be computed.');
        return base;
      }
    }
    const load = usesLoad ? loads[0] : null;
    base.currentLoad = load;

    // Rep test: every prescribed working set at or above the top of the range
    const top = evaluated.filter((x) => x.reps != null && x.reps >= p.repMax).length;
    reasons.push(top + ' of ' + p.sets + ' sets reached ' + p.repMax + ' reps' + (usesLoad ? ' at ' + U.fmtLoad(load) + ' ' + unit + ' ' + loadLabel(ex) : '') + ' (' + evaluated.map((x) => (x.reps == null ? '—' : x.reps)).join('/') + ').');
    if (top < p.sets) {
      reasons.push('An increase needs all ' + p.sets + ' sets at ' + p.repMax + '+ reps. Hold the load and build reps.');
      base.decline = PR.detectDecline(db, ex.id, s.id);
      return base;
    }

    let result;
    if (ex.type === 'bodyweight') {
      reasons.push('All sets at the top of the range. Prioritize control and clean reps first; when that is solid, ' + (ex.family === 'vertical_pull' ? 'switch to weighted pull-ups (a separate history).' : 'move to a harder variation.'));
      result = Object.assign(base, { status: 'bodyweight_top' });
    } else if (ex.type === 'assisted') {
      const next = Math.max(0, load - inc);
      if (load <= 0) reasons.push('Assistance is already 0. Try bodyweight pull-ups next time (a separate history).');
      else reasons.push('All sets at the top of the range. Less assistance is progress: try ' + U.fmtLoad(next) + ' ' + unit + ' assistance (' + U.fmtLoad(inc) + ' ' + unit + ' less).');
      result = Object.assign(base, { status: 'assist_decrease', suggestedLoad: load <= 0 ? null : next });
    } else {
      const next = load + inc;
      reasons.push('All sets at the top of the range. Smallest configured step for this exercise is ' + U.fmtLoad(inc) + ' ' + unit + ': try ' + U.fmtLoad(next) + ' ' + unit + ' ' + loadLabel(ex) + ' next session.');
      result = Object.assign(base, { status: 'increase', suggestedLoad: next });
    }
    if (rirFlag) reasons.push('One or more sets were logged at 0 RIR. Holding the load another session may be appropriate.');
    if (rirNote) reasons.push(rirNote);
    return result;
  };

  /* Repeated decline: three most recent completed sessions of this exercise, each with
     fewer total working reps than the one before at the same or lower load. Returns a
     neutral prompt string or null. Never diagnoses. */
  PR.detectDecline = function (db, exerciseId, throughSessionId) {
    if (!db) return null;
    const hist = PR.history(db, exerciseId).filter((h) => h.status === 'completed');
    const idx = hist.findIndex((h) => h.sessionId === throughSessionId);
    const upto = idx >= 0 ? hist.slice(0, idx + 1) : hist;
    if (upto.length < 4) return null;
    const last4 = upto.slice(-4);
    for (let i = 1; i < last4.length; i++) {
      const prev = last4[i - 1], cur = last4[i];
      if (prev.totalReps == null || cur.totalReps == null) return null;
      if (!(cur.totalReps < prev.totalReps && (cur.topLoad == null || prev.topLoad == null || cur.topLoad <= prev.topLoad))) return null;
    }
    return 'Working reps have dropped over the last three sessions of this exercise. Worth a look at sleep, recovery, technique, and recent workload.';
  };

  /* Per-exercise session history (chronological). One entry per session where the exercise appeared. */
  PR.history = function (db, exerciseId) {
    const out = [];
    D.sessionList(db).forEach((s) => {
      s.exercises.forEach((inst) => {
        if (inst.exerciseId !== exerciseId || inst.skipped) return;
        const sets = D.logicalSets(inst, { completedOnly: true, kind: 'working' });
        if (!sets.length && s.status !== 'completed') return;
        const loads = sets.filter((x) => x.load != null).map((x) => x.load);
        out.push({
          sessionId: s.id, localDate: s.localDate, status: s.status, templateName: s.templateName,
          prescription: inst.prescription, sets,
          totalReps: sets.length ? sets.reduce((a, x) => a + (x.reps || 0), 0) : null,
          topLoad: loads.length ? Math.max.apply(null, loads) : null
        });
      });
    });
    return out;
  };

  CS.progression = PR;
})();


/* ===== core/stats.js ===== */
/* Coastal Strength — core/stats.js
   Derived numbers for Today. Everything here is computed from logged records only. */
(function () {
  const CS = (window.CS = window.CS || {});
  const U = CS.util, D = CS.db;
  const S = {};

  /* Week ring: completed scheduled lifting sessions / scheduled lifting sessions, Mon–Sun.
     Cardio and rest days are never in the denominator. A lift template counts once per
     week regardless of which day it was actually done on. */
  S.weekRing = function (db, localDate) {
    const plan = D.activePlan(db);
    const week = U.weekDates(localDate);
    const first = week[0].date, last = week[6].date;
    const scheduledLift = Object.keys(db.profile.schedule).filter((t) => db.profile.schedule[t] && plan.templates[t] && plan.templates[t].kind === 'lift');
    const completed = {};
    D.sessionList(db).forEach((s) => {
      if (s.status === 'completed' && s.kind === 'lift' && s.localDate >= first && s.localDate <= last) completed[s.templateId] = true;
    });
    const days = week.map((d) => {
      const t = D.templateForWeekday(db, d.key);
      const sessions = D.sessionsOn(db, d.date);
      const forTemplate = sessions.find((s) => s.templateId === t.id);
      return {
        key: d.key, date: d.date, templateId: t.id, templateName: t.name, kind: t.kind,
        status: forTemplate ? forTemplate.status : (sessions.length ? 'other' : 'none'),
        isToday: d.date === localDate, isPast: d.date < localDate,
        sessions
      };
    });
    return {
      completed: scheduledLift.filter((t) => completed[t]).length,
      scheduled: scheduledLift.length,
      days
    };
  };

  S.todayPlan = function (db, localDate) {
    const wd = U.weekday(localDate);
    const t = D.templateForWeekday(db, wd);
    return { weekday: wd, template: t, session: D.sessionFor(db, t.id, localDate) };
  };

  /* Weight card: latest observation + 7-day average when ≥3 observations fall in the last 7 days.
     Missing days stay missing — no zeros, no interpolation. */
  S.weightSummary = function (db, localDate) {
    const latest = D.latestMeasurement(db, 'weight');
    if (!latest) return null;
    const from = U.addDays(localDate, -6);
    const byDay = {};
    db.measurements.filter((m) => m.type === 'weight' && m.localDate >= from && m.localDate <= localDate)
      .sort((a, b) => (a.createdAt < b.createdAt ? -1 : 1))
      .forEach((m) => { byDay[m.localDate] = U.toUnit(m.value, m.unit, db.profile.units); }); // last entry per day wins
    const vals = Object.values(byDay);
    return {
      latest: { value: U.toUnit(latest.value, latest.unit, db.profile.units), unit: db.profile.units, localDate: latest.localDate },
      avg7: vals.length >= 3 ? U.mean(vals) : null,
      avg7Count: vals.length,
      avg7Definition: 'Mean of the last weigh-in on each day with an observation in the trailing 7 days (' + vals.length + ' of 7 days). Shown only with 3+ observations.'
    };
  };

  /* At most two observations, each derived from a specific log. Neutral wording. */
  S.observations = function (db, localDate) {
    const out = [];
    const sessions = D.sessionList(db).filter((s) => s.status === 'completed' && s.kind === 'lift');
    const last = sessions[sessions.length - 1];
    if (last) {
      for (const inst of last.exercises) {
        if (inst.skipped) continue;
        const sets = D.logicalSets(inst, { completedOnly: true, kind: 'working' });
        const p = inst.prescription;
        if (!p.repMax || sets.length < p.sets) continue;
        const top = sets.slice(0, p.sets).every((x) => x.reps != null && x.reps >= p.repMax);
        if (top) {
          const ex = D.exercise(db, inst.exerciseId);
          out.push({ text: 'You hit the top of the range on all ' + p.sets + ' ' + ex.name.toLowerCase() + ' sets on ' + U.fmtLocalDate(last.localDate) + '.', source: { sessionId: last.id, instanceId: inst.instanceId } });
          break;
        }
      }
    }
    const weights = db.measurements.filter((m) => m.type === 'weight');
    const distinctDays = {};
    weights.forEach((m) => { distinctDays[m.localDate] = true; });
    if (Object.keys(distinctDays).length < 3) out.push({ text: 'Not enough weight history for a trend yet (' + Object.keys(distinctDays).length + ' of the 3 days needed).', source: null });
    return out.slice(0, 2);
  };

  CS.stats = S;
})();


/* ===== core/storage.js ===== */
/* Coastal Strength — core/storage.js
   Local-first persistence. The whole database is one JSON document written atomically,
   so a retried write can never duplicate a set or a session.

   Backends, tried in order:
     1. window.storage  — the claude.ai preview's per-user key-value API (artifact sandbox)
     2. IndexedDB       — when hosted as a normal web page / iPhone home-screen app
     3. localStorage    — fallback
     4. memory          — nothing persists; the UI shows a warning
   None of these is cloud sync. Data lives on this device in this browser. */
(function () {
  const CS = (window.CS = window.CS || {});
  const KEY = 'cs:db';
  const ST = {};

  function previewBackend() {
    const w = window.storage;
    if (!w || typeof w.get !== 'function' || typeof w.set !== 'function') return null;
    return {
      mode: 'preview',
      label: 'Preview storage (claude.ai account, this artifact)',
      async probe() {
        const r = await w.set('cs:probe', '1', false);
        if (!r) throw new Error('preview storage set failed');
        try { await w.delete('cs:probe', false); } catch (e) { /* ignore */ }
        return true;
      },
      async load() {
        try {
          const r = await w.get(KEY, false);
          return r && r.value ? r.value : null;
        } catch (e) { return null; } // missing key throws
      },
      async save(json) {
        const r = await w.set(KEY, json, false);
        if (!r) throw new Error('Save rejected by preview storage');
      },
      async clear() { try { await w.delete(KEY, false); } catch (e) { /* ignore */ } }
    };
  }

  function idbBackend() {
    if (typeof indexedDB === 'undefined' || !indexedDB) return null;
    let dbp = null;
    function open() {
      if (dbp) return dbp;
      dbp = new Promise((resolve, reject) => {
        let req;
        try { req = indexedDB.open('coastal-strength', 1); } catch (e) { reject(e); return; }
        req.onupgradeneeded = () => { req.result.createObjectStore('kv'); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error('IndexedDB open failed'));
        req.onblocked = () => reject(new Error('IndexedDB blocked'));
      });
      return dbp;
    }
    function tx(mode, fn) {
      return open().then((db) => new Promise((resolve, reject) => {
        const t = db.transaction('kv', mode);
        const store = t.objectStore('kv');
        const req = fn(store);
        t.oncomplete = () => resolve(req ? req.result : undefined);
        t.onerror = () => reject(t.error || new Error('IndexedDB transaction failed'));
        t.onabort = () => reject(t.error || new Error('IndexedDB transaction aborted'));
      }));
    }
    return {
      mode: 'indexeddb',
      label: 'IndexedDB (this browser on this device)',
      async probe() { await tx('readonly', (s) => s.get('probe')); return true; },
      async load() { const v = await tx('readonly', (s) => s.get(KEY)); return v == null ? null : v; },
      async save(json) { await tx('readwrite', (s) => s.put(json, KEY)); },
      async clear() { await tx('readwrite', (s) => s.delete(KEY)); }
    };
  }

  function localBackend() {
    try {
      const ls = window.localStorage;
      if (!ls) return null;
      ls.setItem('cs:probe', '1'); ls.removeItem('cs:probe');

        mode: 'localstorage',
        label: 'localStorage (this browser on this device)',
        sync: true,
        async probe() { return true; },
        async load() { return ls.getItem(KEY); },
        async save(json) { ls.setItem(KEY, json); },
        saveSync(json) { ls.setItem(KEY, json); },
        async clear() { ls.removeItem(KEY); }
      };
    } catch (e) { return null; }
  }

  function memoryBackend() {
    let mem = null;
    return {
      mode: 'memory',
      label: 'Memory only — nothing is saved',
      async probe() { return true; },
      async load() { return mem; },
      async save(json) { mem = json; },
      async clear() { mem = null; }
    };
  }

  /* Pick the first backend that works. */
  ST.detect = async function (prefer) {
    const candidates = [previewBackend, idbBackend, localBackend, memoryBackend];
    for (const make of candidates) {
      const b = make();
      if (!b) continue;
      if (prefer && b.mode !== prefer && b.mode !== 'memory') continue;
      try {
        await Promise.race([b.probe(), new Promise((_, rej) => setTimeout(() => rej(new Error('probe timeout')), 1500))]);
        return b;
      } catch (e) { /* next */ }
    }
    return memoryBackend();
  };

  /* The store: in-memory db + listeners + debounced, serialized autosave. */
  ST.createStore = function (backend, opts) {
    opts = opts || {};
    const debounceMs = opts.debounceMs == null ? 250 : opts.debounceMs;
    const listeners = [];
    const statusListeners = [];
    let db = null;
    let status = { state: 'idle', at: null, message: '' };
    let timer = null, saving = false, dirtyAgain = false, retryTimer = null;

    function setStatus(s) { status = Object.assign({ at: Date.now() }, s); statusListeners.forEach((f) => f(status)); }

    const store = {
      backend,
      get db() { return db; },
      get status() { return status; },
      onChange(f) { listeners.push(f); return () => { const i = listeners.indexOf(f); if (i >= 0) listeners.splice(i, 1); }; },
      onStatus(f) { statusListeners.push(f); return () => { const i = statusListeners.indexOf(f); if (i >= 0) statusListeners.splice(i, 1); }; },

      async load() {
        const json = await backend.load();
        if (!json) { db = null; return null; }
        try {
          const parsed = JSON.parse(json);
          db = CS.db.migrate(parsed);
        } catch (e) {
          setStatus({ state: 'error', message: 'Stored data could not be read: ' + e.message });
          db = null;
        }
        return db;
      },

      /* Replace the db wholesale (onboarding, import). */
      set(next) { db = next; listeners.forEach((f) => f(db)); store.scheduleSave(); },

      /* Apply a mutation and autosave. Every UI write goes through here. */
      commit(fn, opts) {
        if (!db) return undefined;
        const r = fn(db);
        if (!(opts && opts.silent)) listeners.forEach((f) => f(db));
        store.scheduleSave();
        return r;
      },

      scheduleSave() {
        setStatus({ state: 'dirty', message: 'Unsaved changes' });
        if (timer) clearTimeout(timer);
        timer = setTimeout(() => { timer = null; store.flush(); }, debounceMs);
      },

      /* Serialized: one write at a time; a change during a write triggers one more write after it. */
      async flush() {
        if (!db) return;
        if (saving) { dirtyAgain = true; return; }
        if (timer) { clearTimeout(timer); timer = null; }
        saving = true;
        setStatus({ state: 'saving', message: 'Saving…' });
        try {
          db.savedAt = new Date().toISOString();
          await backend.save(JSON.stringify(db));
          setStatus({ state: 'saved', message: backend.mode === 'memory' ? 'Not saved — storage unavailable' : 'Saved' });
        } catch (e) {
          setStatus({ state: 'error', message: 'Save failed — retrying' });
          if (retryTimer) clearTimeout(retryTimer);
          retryTimer = setTimeout(() => { retryTimer = null; dirtyAgain = true; store.flush(); }, 2000);
        } finally {
          saving = false;
          if (dirtyAgain) { dirtyAgain = false; store.flush(); }
        }
      },

      /* Best-effort synchronous write for pagehide on backends that support it. */
      flushSync() {
        if (!db) return;
        if (backend.saveSync) { try { db.savedAt = new Date().toISOString(); backend.saveSync(JSON.stringify(db)); setStatus({ state: 'saved', message: 'Saved' }); } catch (e) { /* ignore */ } }
        else store.flush();
      },

      async clear() { db = null; if (timer) clearTimeout(timer); await backend.clear(); setStatus({ state: 'idle', message: '' }); }
    };
    return store;
  };

  CS.storage = ST;
})();

(function () {
  const CS = (window.CS = window.CS || {});
  const X = CS.dom, U = CS.util, D = CS.db, P = CS.plan, B = CS.brand, PR = CS.progression;
  const h = X.h;
  const TR = {};

  function nowIso() { return new Date().toISOString(); }

  TR.render = function (root, app, params) {
    params = params || {};
    const db = app.store.db;
    const active = D.findActiveSession(db);
    if (params.view === 'summary' && params.sessionId && db.sessions[params.sessionId]) return renderSummary(root, app, db.sessions[params.sessionId]);
    if (params.view === 'week') return renderWeek(root, app);
    if (active) return renderLogger(root, app, active);
    return renderWeek(root, app);
  };

  /* ---------- week list ---------- */
  function renderWeek(root, app) {
    const db = app.store.db;
    const today = app.today();
    const ring = CS.stats.weekRing(db, today);
    const active = D.findActiveSession(db);
    const stack = h('div.stack');
    stack.appendChild(h('h1', { text: 'This week' }));
    if (active) {
      stack.appendChild(h('div.card', h('div.row.between', h('div', h('b', { text: active.templateName + ' in progress' }), h('div.small.muted', { text: U.fmtLocalDate(active.localDate) })), h('button.btn.sm.primary', { onClick: () => app.navigate('train', { view: 'logger' }), text: 'Resume' }))));
    }
    const list = h('div.card');
    ring.days.forEach((d) => {
      const row = h('div.weekrow', { class: d.isToday ? 'today' : '' });
      row.appendChild(h('div', h('div.day', { text: U.WEEKDAY_SHORT[d.key] }), h('div.tiny.muted', { text: U.fmtLocalDate(d.date) })));
      const mid = h('div.grow', h('div', { text: d.templateName }));
      const s = d.sessions.find((x) => x.templateId === d.templateId) || d.sessions[0];
      if (s && s.templateId !== d.templateId) mid.appendChild(h('div.tiny.muted', { text: 'Also: ' + s.templateName + ' (' + s.status.replace('_', ' ') + ')' }));
      row.appendChild(mid);
      const right = h('div.row');
      if (d.kind === 'rest') right.appendChild(h('span.pill.muted', { text: 'Rest' }));
      else if (d.kind === 'cardio_optional') right.appendChild(h('span.pill.muted', { text: 'Optional' }));
      else if (s && s.status === 'completed') {
        right.appendChild(h('span.pill.done', { text: 'Done' }));
        right.appendChild(h('button.btn.xs', { onClick: () => app.navigate('train', { view: 'summary', sessionId: s.id }), text: 'View' }));
      } else if (s && (s.status === 'in_progress' || s.status === 'paused')) {
        right.appendChild(h('button.btn.xs.primary', { onClick: () => app.navigate('train', { view: 'logger' }), text: 'Resume' }));
      } else if (s && s.status === 'skipped') {
        right.appendChild(h('span.pill.muted', { text: 'Skipped' }));
        if (!active) right.appendChild(h('button.btn.xs', { onClick: () => app.startSession(d.templateId), text: 'Start today' }));
      } else if (!active && d.kind === 'lift' || (!active && d.kind === 'conditioning')) {

      h('div', h('h1', { text: session.templateName }), h('div.small.muted', { text: U.fmtLocalDate(session.localDate, { weekday: 'short', month: 'short', day: 'numeric' }) + ' · ' + c.workingDone + ' of ' + c.workingPrescribed + ' working sets' })),

  function loadHint(ex) {
    return { per_dumbbell: 'per dumbbell', total_bar: 'bar total', machine_stack: 'stack', assistance: 'assist', added: 'added', none: '' }[ex.loadConvention] || '';
  }

  function fmtSets(sets, unit, ex) {
    if (!sets || !sets.length) return null;
    if (ex.type === 'timed') return sets.map((s) => (s.durationSec == null ? '—' : s.durationSec + ' s')).join(', ');
    const loads = sets.map((s) => s.load);
    const same = loads.every((l) => l === loads[0]);
    const reps = sets.map((s) => (s.reps == null ? '—' : s.reps)).join(', ');
    if (ex.loadConvention === 'none') return reps + ' reps';
    if (same) return (loads[0] == null ? '—' : U.fmtLoad(loads[0])) + ' ' + unit + ' × ' + reps;

  function exerciseCard(app, session, inst) {
    const db = app.store.db;
    const sid = session.id;
    const ex = D.exercise(db, inst.exerciseId);
    const p = inst.prescription;
    const card = h('div.card.excard', { class: inst.skipped ? 'skipped' : '', 'data-inst': inst.instanceId });
