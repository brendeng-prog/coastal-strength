/* Lists (edge to edge, hairline dividers) */

/* Today */

.ring { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }

.daydot i { display: block; width: 10px; height: 10px; border-radius: 50%; margin: 0 auto 4px; border: 1.5px solid var(--line-strong); }
.daydot.lift i { border-color: var(--ink); }

.weight .big { font-size: 22px; font-weight: 600; }
.obs { padding: 12px 0 0; border-top: 1px solid var(--line); font-size: 15px; color: var(--muted); }

/* Logger — focus mode */
.focus-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0 6px; }
.focus-head .elapsed { font-size: 17px; color: var(--muted); }
.dots { display: flex; gap: 6px; justify-content: center; padding: 6px 0 12px; }

.exname { font-size: 28px; font-weight: 600; line-height: 1.1; }
.exmeta { font-size: 15px; color: var(--muted); margin-top: 4px; }
.lastline { font-size: 15px; color: var(--muted); margin-top: 10px; }
.target { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: var(--sand-tint); font-size: 15px; }
.sets { margin: 14px -16px 0; }

.nav { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 18px; }

.sheet .list > *:first-child { border-top: 0; }

.sheet .list .ovrow .ovname { font: inherit; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: 10px; font-size: 15px; z-index: 50; max-width: 90vw; }

/* Summary */
.summ .stat { font-size: 28px; font-weight: 600; line-height: 1.1; }
.prline { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }

.nextline { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }

/* Onboarding */

.ob .actions { position: sticky; bottom: 0; padding: 12px 0 calc(8px + env(safe-area-inset-bottom)); background: var(--surface); margin-top: 20px; display: flex; gap: 10px; }

@media (prefers-reduced-motion: no-preference) {

<script>
/* ===== core/util.js ===== */
/* Coastal Strength — core/util.js
   Plain-script module. Attaches to window.CS.util. No DOM access. */
(function () {
  const CS = (window.CS = window.CS || {});
  const U = {};

  U.uid = function (prefix) {
    return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9);
  };

  U.defaultTz = function () {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (e) { return 'UTC'; }
  };

  const fmtCache = {};
  function fmtFor(tz) {
    if (fmtCache[tz]) return fmtCache[tz];
    let f;
    try {
      f = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' });
    } catch (e) {
      f = new Intl.DateTimeFormat('en-CA', { year: 'numeric', month: '2-digit', day: '2-digit' });
    }
    fmtCache[tz] = f;
    return f;
  }

  /* Local calendar date (YYYY-MM-DD) for an instant, in the given IANA zone.
     Schedules and daily logs key off this; timestamps stay UTC ISO. */
  U.localDate = function (ts, tz) {
    const d = ts instanceof Date ? ts : new Date(ts);
    const parts = fmtFor(tz || U.defaultTz()).formatToParts(d);
    const get = (t) => parts.find((p) => p.type === t).value;
    return get('year') + '-' + get('month') + '-' + get('day');
  };

  U.WEEKDAYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
  U.WEEKDAY_LABEL = { mon: 'Monday', tue: 'Tuesday', wed: 'Wednesday', thu: 'Thursday', fri: 'Friday', sat: 'Saturday', sun: 'Sunday' };
  U.WEEKDAY_SHORT = { mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat', sun: 'Sun' };

  function split(localDate) {
    const p = localDate.split('-').map(Number);
    return { y: p[0], m: p[1], d: p[2] };
  }

  U.isLocalDate = function (s) {
    return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  };

  U.weekday = function (localDate) {
    const { y, m, d } = split(localDate);
    const dow = new Date(Date.UTC(y, m - 1, d)).getUTCDay(); // 0 = Sunday
    return U.WEEKDAYS[(dow + 6) % 7];
  };

  U.addDays = function (localDate, n) {
    const { y, m, d } = split(localDate);
    return new Date(Date.UTC(y, m - 1, d) + n * 86400000).toISOString().slice(0, 10);
  };

  U.diffDays = function (a, b) {
    const A = split(a), B = split(b);
    return Math.round((Date.UTC(B.y, B.m - 1, B.d) - Date.UTC(A.y, A.m - 1, A.d)) / 86400000);
  };

  /* Monday-start weeks. */
  U.weekStart = function (localDate) {
    return U.addDays(localDate, -U.WEEKDAYS.indexOf(U.weekday(localDate)));
  };

  U.weekDates = function (localDate) {
    const s = U.weekStart(localDate);
    return U.WEEKDAYS.map((key, i) => ({ key, date: U.addDays(s, i) }));
  };

  U.fmtLocalDate = function (localDate, opts) {
    const { y, m, d } = split(localDate);
    const dt = new Date(Date.UTC(y, m - 1, d));
    const o = Object.assign({ month: 'short', day: 'numeric', timeZone: 'UTC' }, opts || {});
    return new Intl.DateTimeFormat('en-US', o).format(dt);
  };

  /* Units */
  U.LB_PER_KG = 2.2046226218;
  U.toUnit = function (value, from, to) {
    if (value == null || from === to) return value;
    return from === 'lb' ? value / U.LB_PER_KG : value * U.LB_PER_KG;
  };
  U.fmtNum = function (n, maxDecimals) {
    if (n == null || isNaN(n)) return '—';
    const md = maxDecimals == null ? 2 : maxDecimals;
    const r = Math.round(n * Math.pow(10, md)) / Math.pow(10, md);
    return String(r);
  };
  U.fmtLoad = function (n) { return U.fmtNum(n, 2); };

  /* Parse a numeric input. Returns { value, error }.
     Empty -> null value with no error. Negative -> error. */
  U.parseNum = function (raw, opts) {
    opts = opts || {};
    if (raw == null) return { value: null };
    const s = String(raw).trim().replace(',', '.');
    if (s === '') return { value: null };
    if (!/^-?\d*(\.\d*)?$/.test(s) || s === '-' || s === '.') return { value: null, error: 'Enter a number.' };
    const v = Number(s);
    if (isNaN(v)) return { value: null, error: 'Enter a number.' };
    if (v < 0) return { value: null, error: "Can't be negative." };
    if (opts.integer && Math.round(v) !== v) return { value: null, error: 'Whole numbers only.' };
    if (opts.max != null && v > opts.max) return { value: null, error: 'Too large.' };
    return { value: v };
  };

  U.fmtDuration = function (ms) {
    if (ms == null || ms < 0) ms = 0;
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const pad = (n) => (n < 10 ? '0' + n : '' + n);
    return h > 0 ? h + ':' + pad(m) + ':' + pad(sec) : m + ':' + pad(sec);
  };

  U.fmtClock = function (sec) {
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  };

  U.clone = function (o) { return JSON.parse(JSON.stringify(o)); };

  U.mean = function (arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null; };

  CS.util = U;
})();


/* ===== core/plan.js ===== */
/* Coastal Strength — core/plan.js
   Exercise catalogue + default plan template (spec §6, seeded exactly). */
(function () {
  const CS = (window.CS = window.CS || {});

  /* Exercise types and load conventions — modelled explicitly, never flattened.
     type:           dumbbell | barbell | machine | cable | bodyweight | assisted | weighted_bw | timed
     loadConvention: per_dumbbell | total_bar | machine_stack | none | assistance | added
     Increments are per exercise and per unit; editable later in Profile (not yet built). */
  function ex(id, name, type, opts) {
    const conv = {
      dumbbell: 'per_dumbbell', barbell: 'total_bar', machine: 'machine_stack', cable: 'machine_stack',
      bodyweight: 'none', assisted: 'assistance', weighted_bw: 'added', timed: 'none'
    }[type];

    const planId = U.uid('plan');
    const db = {
      schemaVersion: D.SCHEMA_VERSION,
      createdAt: nowIso,
      profile: {
        name: input.name || '',
        heightIn: input.heightIn == null ? null : input.heightIn,
        units: input.units === 'kg' ? 'kg' : 'lb',
        timezone: tz,
        schedule: Object.assign({}, P.DEFAULT_SCHEDULE, input.schedule || {}),
        equipment: input.equipment || {},
        picks: Object.assign({}, input.picks || {}),
        nutritionMode: input.nutritionMode || 'undecided',
        calorieTarget: input.calorieTarget == null ? null : input.calorieTarget,
        experience: input.experience || '',
        limitations: input.limitations || '',
        frameNoteShown: !!input.frameNoteShown,
        onboarded: true
      },
      exercises: U.clone(P.EXERCISE_MAP),
      planVersions: [{ id: planId, version: 1, createdAt: nowIso, note: 'Default plan', templates: U.clone(P.DEFAULT_TEMPLATES) }],
      activePlanVersionId: planId,
      sessions: {},
      sessionOrder: [],
      measurements: [],
      cardioSessions: [],
      recoveryLogs: {},
      nutrition: { days: {}, savedFoods: [] },
      suggestions: {},
      prs: [],
      timer: null,
      settings: D.defaultSettings()
    };
    // Default picks: first option of every OR slot unless the user chose.
    P.OR_SLOTS.forEach((s) => { if (!db.profile.picks[s.slotId]) db.profile.picks[s.slotId] = s.options[0]; });
    if (input.weight != null) {

  D.activePlan = function (db) {
    return db.planVersions.find((p) => p.id === db.activePlanVersionId) || db.planVersions[db.planVersions.length - 1];
  };

  D.templateForWeekday = function (db, weekday) {
    const plan = D.activePlan(db);
    const tid = Object.keys(db.profile.schedule).find((t) => db.profile.schedule[t] === weekday && plan.templates[t]);
    return tid ? plan.templates[tid] : { id: 'rest', name: 'Rest', kind: 'rest' };

  D.sessionList = function (db) { return db.sessionOrder.map((id) => db.sessions[id]).filter(Boolean); };

  D.sessionsOn = function (db, localDate) { return D.sessionList(db).filter((s) => s.localDate === localDate); };

    const seen = {};

      } else {

    const sg = db.suggestions[key];
    if (!sg) return;
    sg.decision = decision;
    sg.decidedAt = new Date().toISOString();
    if (decision === 'accepted') sg.appliedLoad = sg.result.suggestedLoad;
    else if (decision === 'overridden') sg.appliedLoad = overrideLoad;
    else sg.appliedLoad = null;
  };

  D.skipSession = function (db, templateId, localDate, nowIso, reason) {
    let s = D.sessionFor(db, templateId, localDate);
    if (!s) s = db.sessions[D.createSession(db, templateId, localDate, nowIso)];
    if (s.status === 'completed') return s.id;
    s.status = 'skipped';
    s.skipReason = reason || '';
    return s.id;
  };

  /* ---------- set-level mutations ---------- */

  function findInst(db, sid, iid) {
    const s = db.sessions[sid];
    return s ? s.exercises.find((e) => e.instanceId === iid) : null;
  }
  D.instance = findInst;

  D.setField = function (db, sid, iid, setId, field, value) {
    const inst = findInst(db, sid, iid);
    if (!inst) return;
    const set = inst.sets.find((x) => x.id === setId);
    if (!set) return;
    if (['load', 'reps', 'durationSec', 'rir', 'notes'].indexOf(field) < 0) return;
    set[field] = value;
    if (field !== 'notes') set.prefilled = false;
    // Linked unilateral: nothing to mirror (single row). Separate rows are edited individually.
  };

  D.toggleComplete = function (db, sid, iid, setId, nowIso) {
    const inst = findInst(db, sid, iid);
    if (!inst) return;
    const set = inst.sets.find((x) => x.id === setId);
    if (!set) return;
    if (set.completed) {
      set.completed = false;
      set.completedAt = null;
    } else {
      set.completed = true;
      set.completedAt = nowIso;
      set.prefilled = false;
    }
    return set.completed;
  };

  D.addSet = function (db, sid, iid, kind) {
    const inst = findInst(db, sid, iid);
    if (!inst) return;
    const ex = D.exercise(db, inst.exerciseId);
    const unit = db.profile.units;
    const lastWorking = inst.sets.slice().reverse().find((s) => s.kind === 'working');
    const base = lastWorking ? { load: lastWorking.load, reps: lastWorking.reps, durationSec: lastWorking.durationSec } : null;
    if (inst.sidesSeparate) {
      const pairId = U.uid('pair');
      const a = newSet(ex, unit, base, kind); a.side = 'L'; a.pairId = pairId;
      const b = newSet(ex, unit, base, kind); b.side = 'R'; b.pairId = pairId;
      a.prefilled = b.prefilled = false;
      inst.sets.push(a, b);
      return a.id;
    }
    const s = newSet(ex, unit, base, kind);
    s.prefilled = false;
    if (kind === 'warmup') {
      const firstWorking = inst.sets.findIndex((x) => x.kind === 'working');
      inst.sets.splice(firstWorking < 0 ? inst.sets.length : firstWorking, 0, s);
    } else inst.sets.push(s);
    return s.id;
  };

  D.deleteSet = function (db, sid, iid, setId) {
    const inst = findInst(db, sid, iid);
    if (!inst) return;
    const set = inst.sets.find((x) => x.id === setId);
    if (!set) return;
    inst.sets = inst.sets.filter((x) => (set.pairId ? x.pairId !== set.pairId : x.id !== setId));
  };

  D.setKind = function (db, sid, iid, setId, kind) {
    const inst = findInst(db, sid, iid);
    if (!inst) return;
    const set = inst.sets.find((x) => x.id === setId);
    if (!set) return;
    const targets = set.pairId ? inst.sets.filter((x) => x.pairId === set.pairId) : [set];
    targets.forEach((t) => { t.kind = kind; });
  };

  /* Switch a unilateral exercise between linked (one row = both sides) and separate L/R rows. */
  D.setSidesSeparate = function (db, sid, iid, separate) {
    const inst = findInst(db, sid, iid);
    if (!inst || !!inst.sidesSeparate === !!separate) return;
    const next = [];
    if (separate) {
      inst.sets.forEach((s) => {
        if (s.side !== 'both') { next.push(s); return; }
        const pairId = U.uid('pair');
        const L = Object.assign({}, s, { id: U.uid('set'), side: 'L', pairId });
        const R = Object.assign({}, s, { id: U.uid('set'), side: 'R', pairId });
        next.push(L, R);
      });
    } else {
      const seen = {};
      inst.sets.forEach((s) => {
        if (s.side === 'both' || !s.pairId) { next.push(s); return; }
        if (seen[s.pairId]) return;
        seen[s.pairId] = true;
        const pair = inst.sets.filter((x) => x.pairId === s.pairId);
        const both = pair.every((x) => x.completed);
        const merged = Object.assign({}, pair[0], { id: U.uid('set'), side: 'both', pairId: null, completed: both, completedAt: both ? pair[0].completedAt : null });
        if (pair.length === 2 && pair[0].reps != null && pair[1].reps != null) merged.reps = Math.min(pair[0].reps, pair[1].reps);
        next.push(merged);
      });
    }
    inst.sets = next;
    inst.sidesSeparate = !!separate;
  };

  D.skipExercise = function (db, sid, iid, reason) {
    const inst = findInst(db, sid, iid);
    if (!inst) return;
    inst.skipped = true;
    inst.skipReason = reason || '';
  };

  D.unskipExercise = function (db, sid, iid) {
    const inst = findInst(db, sid, iid);
    if (!inst) return;
    inst.skipped = false;
    inst.skipReason = '';
  };

  /* Substitution keeps separate histories: the new exercise prefills from ITS own history. */
  D.substituteExercise = function (db, sid, iid, newExerciseId) {
    const inst = findInst(db, sid, iid);
    const ex = D.exercise(db, newExerciseId);
    if (!inst || !ex) return;
    const anyDone = inst.sets.some((s) => s.completed);
    if (anyDone) return false; // never rewrite logged work
    inst.substitutedFrom = inst.substitutedFrom || inst.exerciseId;
    inst.exerciseId = newExerciseId;
    const built = D.buildSets(db, ex, inst.prescription, sid);
    inst.sets = built.sets;
    inst.sidesSeparate = false;
    inst.lastPerformance = built.last ? { sessionId: built.last.sessionId, localDate: built.last.localDate, sets: built.last.sets.map((s) => ({ load: s.load, unit: s.unit, reps: s.reps, durationSec: s.durationSec })) } : null;
    inst.restSec = ex.compound ? db.settings.restDefaults.compound : db.settings.restDefaults.isolation;
    if (built.suggestion) built.suggestion.consumedBy = sid;
    return true;
  };

  D.moveExercise = function (db, sid, iid, dir) {
    const s = db.sessions[sid];
    if (!s) return;
    const i = s.exercises.findIndex((e) => e.instanceId === iid);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= s.exercises.length) return;
    const tmp = s.exercises[i]; s.exercises[i] = s.exercises[j]; s.exercises[j] = tmp;
    s.exercises.forEach((e, k) => { e.order = k; });
  };

  D.setInstanceField = function (db, sid, iid, field, value) {
    const inst = findInst(db, sid, iid);
    if (!inst) return;
    if (['notes', 'restSec'].indexOf(field) < 0) return;
    inst[field] = value;
  };

  D.setSessionField = function (db, sid, field, value) {
    const s = db.sessions[sid];
    if (!s) return;
    if (['notes', 'energy', 'difficulty', 'soreness'].indexOf(field) < 0) return;
    s[field] = value;
  };

  /* ---------- counts (completed only — prefilled never counts) ---------- */

  D.counts = function (session) {
    let workingDone = 0, workingPrescribed = 0, exercisesDone = 0, exercisesTotal = 0, warmupsDone = 0;
    (session.exercises || []).forEach((inst) => {
      if (inst.skipped) return;
      exercisesTotal++;
      const done = D.logicalSets(inst, { completedOnly: true, kind: 'working' }).length;
      workingDone += done;
      workingPrescribed += inst.prescription.sets;
      warmupsDone += D.logicalSets(inst, { completedOnly: true, kind: 'warmup' }).length;
      if (done >= inst.prescription.sets) exercisesDone++;
    });
    return { workingDone, workingPrescribed, exercisesDone, exercisesTotal, warmupsDone };
  };

  /* ---------- measurements ---------- */

  D.addMeasurement = function (db, m, nowIso) {
    const rec = { id: U.uid('meas'), type: m.type, value: m.value, unit: m.unit || null, localDate: m.localDate, createdAt: nowIso || new Date().toISOString(), note: m.note || '' };
    db.measurements.push(rec);
    return rec.id;
  };

  D.latestMeasurement = function (db, type) {
    const list = db.measurements.filter((m) => m.type === type).sort((a, b) => (a.localDate < b.localDate ? 1 : a.localDate > b.localDate ? -1 : (a.createdAt < b.createdAt ? 1 : -1)));
    return list[0] || null;
  };

  /* ---------- rest timer (timestamp based; persisted so it survives navigation and reload) ---------- */

  D.startRest = function (db, seconds, nowMs, sessionId) {
    db.timer = { kind: 'rest', startedAt: nowMs, endsAt: nowMs + seconds * 1000, durationSec: seconds, pausedAt: null, remainingMs: null, alerted: false, sessionId: sessionId || null };
  };
  D.adjustRest = function (db, deltaSec, nowMs) {
    const t = db.timer; if (!t) return;
    if (t.pausedAt != null) t.remainingMs = Math.max(0, t.remainingMs + deltaSec * 1000);
    else t.endsAt = Math.max(nowMs, t.endsAt + deltaSec * 1000);
    t.alerted = false;
  };
  D.pauseRest = function (db, nowMs) {
    const t = db.timer; if (!t || t.pausedAt != null) return;
    t.pausedAt = nowMs; t.remainingMs = Math.max(0, t.endsAt - nowMs);
  };
  D.resumeRest = function (db, nowMs) {
    const t = db.timer; if (!t || t.pausedAt == null) return;
    t.endsAt = nowMs + t.remainingMs; t.pausedAt = null; t.remainingMs = null;
  };
  D.dismissRest = function (db) { db.timer = null; };
  D.restState = function (db, nowMs) {
    const t = db.timer; if (!t) return null;
    const remainingMs = t.pausedAt != null ? t.remainingMs : t.endsAt - nowMs;
    return { remainingSec: Math.max(0, Math.ceil(remainingMs / 1000)), done: remainingMs <= 0, paused: t.pausedAt != null, durationSec: t.durationSec, alerted: t.alerted };
  };

  /* ---------- migrations ---------- */

  D.migrate = function (db) {
    if (!db || typeof db !== 'object') return null;
    if (!db.schemaVersion) db.schemaVersion = 1;
    if (db.schemaVersion < 2) {
      db.settings = Object.assign(D.defaultSettings(), db.settings || {});
      db.prs = db.prs || [];
      db.schemaVersion = 2;
    }
    return db;
  };

  /* "Same as last": complete every not-yet-completed working set that has prefilled values.
     Returns the ids of the sets it completed so the action can be undone as one unit. */
  D.completePrefilled = function (db, sid, iid, nowIso) {
    const inst = findInst(db, sid, iid);
    if (!inst) return [];
    const done = [];
    inst.sets.forEach((s) => {
      if (s.kind !== 'working' || s.completed) return;
      const hasValue = s.load != null || s.reps != null || s.durationSec != null;
      if (!hasValue) return;
      s.completed = true; s.completedAt = nowIso; s.prefilled = false;
      done.push(s.id);
    });
    return done;
  };

  D.uncompleteSets = function (db, sid, iid, setIds) {
    const inst = findInst(db, sid, iid);
    if (!inst) return;
    inst.sets.forEach((s) => { if (setIds.indexOf(s.id) >= 0) { s.completed = false; s.completedAt = null; } });
  };

  /* Stepper helper: adjust a numeric set field by a delta, clamped at 0. */
  D.stepField = function (db, sid, iid, setId, field, delta) {
    const inst = findInst(db, sid, iid);
    if (!inst) return null;
    const set = inst.sets.find((x) => x.id === setId);
    if (!set) return null;
    const cur = set[field] == null ? 0 : set[field];
    const next = Math.max(0, Math.round((cur + delta) * 100) / 100);
    set[field] = next; set.prefilled = false;
    return next;
  };

  CS.db = D;
})();


/* ===== core/progression.js ===== */
/* Coastal Strength — core/progression.js
   Transparent double progression. Every result carries its exact reasons.
   Nothing here rewrites a workout; results are suggestions the user decides on. */
(function () {
  const CS = (window.CS = window.CS || {});
  const U = CS.util, D = CS.db;
  const PR = {};

  function loadLabel(ex) {
    return { per_dumbbell: 'per dumbbell', total_bar: 'total bar', machine_stack: 'on the stack', assistance: 'assistance', added: 'added', none: '' }[ex.loadConvention] || '';
  }

  /* evaluate({ exercise, instance, session, db }) ->
     { status, reasons[], currentLoad, suggestedLoad, increment, unit, rirFlag, rirNote, decline }
     status: increase | assist_decrease | bodyweight_top | timed_top | hold | none | not_evaluated */
  PR.evaluate = function (args) {
    const ex = args.exercise, inst = args.instance, s = args.session, db = args.db;
    const p = inst.prescription;
    const reasons = [];
    const unit = (inst.sets.find((x) => x.unit) || {}).unit || (db && db.profile.units) || 'lb';
    const inc = unit === 'kg' ? ex.incrementKg : ex.incrementLb;
    const base = { status: 'none', reasons, currentLoad: null, suggestedLoad: null, increment: inc, unit, rirFlag: false, rirNote: null, decline: null, exerciseName: ex.name };

    if (!s || s.status !== 'completed') {
      reasons.push('Session not finished. Increases are only evaluated for completed sessions.');
      return Object.assign(base, { status: 'not_evaluated' });
    }
    if (inst.skipped) {
      reasons.push('Exercise skipped this session.');
      return Object.assign(base, { status: 'not_evaluated' });
    }

    const done = D.logicalSets(inst, { completedOnly: true, kind: 'working' });
    reasons.push('Warm-up sets excluded. ' + done.length + ' of ' + p.sets + ' prescribed working sets completed.');
    if (done.length < p.sets) {
      reasons.push('Not every prescribed working set was completed, so no increase.');
      return base;
    }
    const evaluated = done.slice(0, p.sets);
    if (done.length > p.sets) reasons.push((done.length - p.sets) + ' extra set(s) logged; only the first ' + p.sets + ' prescribed sets are evaluated.');

    // RIR
    const rirLogged = evaluated.filter((x) => x.rir != null);
    const rirFlag = rirLogged.some((x) => x.rir <= 0);
    const rirNote = rirLogged.length ? null : 'RIR was not logged, so this used load and reps only.';
    base.rirFlag = rirFlag; base.rirNote = rirNote;

    // Timed holds
    if (ex.type === 'timed' && p.timed) {
      const top = evaluated.filter((x) => x.durationSec != null && x.durationSec >= p.timed.secMax).length;
      reasons.push(top + ' of ' + p.sets + ' holds reached ' + p.timed.secMax + ' s.');
      if (top < p.sets) { reasons.push('Progress toward ' + p.timed.secMax + ' s on every hold.'); return base; }
      reasons.push('Every hold reached the upper bound. Make the hold harder (e.g. feet elevated) or extend the target — your call.');
      return Object.assign(base, { status: 'timed_top' });
    }

    // Load consistency
    const loads = evaluated.map((x) => x.load);
    const usesLoad = ex.loadConvention !== 'none';
    if (usesLoad) {
      const distinct = {};
      loads.forEach((l) => { distinct[l == null ? 'none' : String(l)] = true; });
      const mixed = evaluated.some((x) => x.mixedLoad) || Object.keys(distinct).length > 1;
      if (mixed) {
        reasons.push('Sets used different loads (' + loads.map((l) => (l == null ? '—' : U.fmtLoad(l))).join(', ') + ' ' + unit + '). A blanket increase is never suggested for a mixed-load session.');
        return base;
      }
      if (loads[0] == null) {
        reasons.push('No load was logged, so no increase can be computed.');
        return base;
      }
    }
    const load = usesLoad ? loads[0] : null;
    base.currentLoad = load;

    // Rep test: every prescribed working set at or above the top of the range
    const top = evaluated.filter((x) => x.reps != null && x.reps >= p.repMax).length;
    reasons.push(top + ' of ' + p.sets + ' sets reached ' + p.repMax + ' reps' + (usesLoad ? ' at ' + U.fmtLoad(load) + ' ' + unit + ' ' + loadLabel(ex) : '') + ' (' + evaluated.map((x) => (x.reps == null ? '—' : x.reps)).join('/') + ').');
    if (top < p.sets) {
      reasons.push('An increase needs all ' + p.sets + ' sets at ' + p.repMax + '+ reps. Hold the load and build reps.');
      base.decline = PR.detectDecline(db, ex.id, s.id);
      return base;
    }

    let result;
    if (ex.type === 'bodyweight') {
      reasons.push('All sets at the top of the range. Prioritize control and clean reps first; when that is solid, ' + (ex.family === 'vertical_pull' ? 'switch to weighted pull-ups (a separate history).' : 'move to a harder variation.'));
      result = Object.assign(base, { status: 'bodyweight_top' });
    } else if (ex.type === 'assisted') {
      const next = Math.max(0, load - inc);
      if (load <= 0) reasons.push('Assistance is already 0. Try bodyweight pull-ups next time (a separate history).');
      else reasons.push('All sets at the top of the range. Less assistance is progress: try ' + U.fmtLoad(next) + ' ' + unit + ' assistance (' + U.fmtLoad(inc) + ' ' + unit + ' less).');
      result = Object.assign(base, { status: 'assist_decrease', suggestedLoad: load <= 0 ? null : next });
    } else {
      const next = load + inc;
      reasons.push('All sets at the top of the range. Smallest configured step for this exercise is ' + U.fmtLoad(inc) + ' ' + unit + ': try ' + U.fmtLoad(next) + ' ' + unit + ' ' + loadLabel(ex) + ' next session.');
      result = Object.assign(base, { status: 'increase', suggestedLoad: next });
    }
    if (rirFlag) reasons.push('One or more sets were logged at 0 RIR. Holding the load another session may be appropriate.');
    if (rirNote) reasons.push(rirNote);
    return result;
  };

  /* Repeated decline: three most recent completed sessions of this exercise, each with
     fewer total working reps than the one before at the same or lower load. Returns a
     neutral prompt string or null. Never diagnoses. */
  PR.detectDecline = function (db, exerciseId, throughSessionId) {
    if (!db) return null;
    const hist = PR.history(db, exerciseId).filter((h) => h.status === 'completed');
    const idx = hist.findIndex((h) => h.sessionId === throughSessionId);
    const upto = idx >= 0 ? hist.slice(0, idx + 1) : hist;
    if (upto.length < 4) return null;
    const last4 = upto.slice(-4);
    for (let i = 1; i < last4.length; i++) {
      const prev = last4[i - 1], cur = last4[i];
      if (prev.totalReps == null || cur.totalReps == null) return null;
      if (!(cur.totalReps < prev.totalReps && (cur.topLoad == null || prev.topLoad == null || cur.topLoad <= prev.topLoad))) return null;
    }
    return 'Working reps have dropped over the last three sessions of this exercise. Worth a look at sleep, recovery, technique, and recent workload.';
  };

  /* Per-exercise session history (chronological). One entry per session where the exercise appeared. */
  PR.history = function (db, exerciseId) {
    const out = [];
    D.sessionList(db).forEach((s) => {
      s.exercises.forEach((inst) => {
        if (inst.exerciseId !== exerciseId || inst.skipped) return;
        const sets = D.logicalSets(inst, { completedOnly: true, kind: 'working' });
        if (!sets.length && s.status !== 'completed') return;
        const loads = sets.filter((x) => x.load != null).map((x) => x.load);
        out.push({
          sessionId: s.id, localDate: s.localDate, status: s.status, templateName: s.templateName,
          prescription: inst.prescription, sets,
          totalReps: sets.length ? sets.reduce((a, x) => a + (x.reps || 0), 0) : null,
          topLoad: loads.length ? Math.max.apply(null, loads) : null
        });
      });
    });
    return out;
  };

  CS.progression = PR;
})();


/* ===== core/stats.js ===== */
/* Coastal Strength — core/stats.js
   Derived numbers for Today. Everything here is computed from logged records only. */
(function () {
  const CS = (window.CS = window.CS || {});
  const U = CS.util, D = CS.db;
  const S = {};

  /* Week ring: completed scheduled lifting sessions / scheduled lifting sessions, Mon–Sun.
     Cardio and rest days are never in the denominator. A lift template counts once per
     week regardless of which day it was actually done on. */
  S.weekRing = function (db, localDate) {
    const plan = D.activePlan(db);
    const week = U.weekDates(localDate);
    const first = week[0].date, last = week[6].date;
    const scheduledLift = Object.keys(db.profile.schedule).filter((t) => db.profile.schedule[t] && plan.templates[t] && plan.templates[t].kind === 'lift');
    const completed = {};
    D.sessionList(db).forEach((s) => {
      if (s.status === 'completed' && s.kind === 'lift' && s.localDate >= first && s.localDate <= last) completed[s.templateId] = true;
    });
    const days = week.map((d) => {
      const t = D.templateForWeekday(db, d.key);
      const sessions = D.sessionsOn(db, d.date);
      const forTemplate = sessions.find((s) => s.templateId === t.id);
      return {
        key: d.key, date: d.date, templateId: t.id, templateName: t.name, kind: t.kind,
        status: forTemplate ? forTemplate.status : (sessions.length ? 'other' : 'none'),
        isToday: d.date === localDate, isPast: d.date < localDate,
        sessions
      };
    });
    return {
      completed: scheduledLift.filter((t) => completed[t]).length,
      scheduled: scheduledLift.length,
      days
    };
  };

  S.todayPlan = function (db, localDate) {
    const wd = U.weekday(localDate);
    const t = D.templateForWeekday(db, wd);
    return { weekday: wd, template: t, session: D.sessionFor(db, t.id, localDate) };
  };

  /* Weight card: latest observation + 7-day average when ≥3 observations fall in the last 7 days.
     Missing days stay missing — no zeros, no interpolation. */
  S.weightSummary = function (db, localDate) {
    const latest = D.latestMeasurement(db, 'weight');
    if (!latest) return null;
    const from = U.addDays(localDate, -6);
    const byDay = {};
    db.measurements.filter((m) => m.type === 'weight' && m.localDate >= from && m.localDate <= localDate)
      .sort((a, b) => (a.createdAt < b.createdAt ? -1 : 1))
      .forEach((m) => { byDay[m.localDate] = U.toUnit(m.value, m.unit, db.profile.units); }); // last entry per day wins
    const vals = Object.values(byDay);
    return {
      latest: { value: U.toUnit(latest.value, latest.unit, db.profile.units), unit: db.profile.units, localDate: latest.localDate },
      avg7: vals.length >= 3 ? U.mean(vals) : null,
      avg7Count: vals.length,
      avg7Definition: 'Mean of the last weigh-in on each day with an observation in the trailing 7 days (' + vals.length + ' of 7 days). Shown only with 3+ observations.'
    };
  };

  /* At most two observations, each derived from a specific log. Neutral wording. */
  S.observations = function (db, localDate) {
    const out = [];
    const sessions = D.sessionList(db).filter((s) => s.status === 'completed' && s.kind === 'lift');
    const last = sessions[sessions.length - 1];
    if (last) {
      for (const inst of last.exercises) {
        if (inst.skipped) continue;
        const sets = D.logicalSets(inst, { completedOnly: true, kind: 'working' });
        const p = inst.prescription;
        if (!p.repMax || sets.length < p.sets) continue;
        const top = sets.slice(0, p.sets).every((x) => x.reps != null && x.reps >= p.repMax);
        if (top) {
          const ex = D.exercise(db, inst.exerciseId);
          out.push({ text: ex.name + ': ' + p.sets + '/' + p.sets + ' at ' + p.repMax + ' · ' + U.fmtLocalDate(last.localDate), source: { sessionId: last.id, instanceId: inst.instanceId } });
          break;
        }
      }
    }
    const weights = db.measurements.filter((m) => m.type === 'weight');
    const distinctDays = {};
    weights.forEach((m) => { distinctDays[m.localDate] = true; });
    if (Object.keys(distinctDays).length < 3) out.push({ text: 'Weight trend: ' + Object.keys(distinctDays).length + ' / 3 weigh-ins', source: null });
    return out.slice(0, 2);
  };

  /* Typed PRs for a just-completed session, judged against completed sessions before it.
     A first-ever session of an exercise sets the baseline and produces no PR. */
  S.detectPRs = function (db, session) {
    const out = [];
    const earlier = D.sessionList(db).filter((s) => s.id !== session.id && s.status === 'completed' && (s.finishedAt || '') < (session.finishedAt || '9'));
    session.exercises.forEach((inst) => {
      if (inst.skipped) return;
      const ex = D.exercise(db, inst.exerciseId);
      const now = D.logicalSets(inst, { completedOnly: true, kind: 'working' });
      if (!now.length) return;
      const prev = [];
      earlier.forEach((s) => s.exercises.forEach((pi) => { if (pi.exerciseId === inst.exerciseId && !pi.skipped) prev.push.apply(prev, D.logicalSets(pi, { completedOnly: true, kind: 'working' })); }));
      if (!prev.length) return;
      const unit = db.profile.units;
      const L = (x) => (x.load == null ? null : U.toUnit(x.load, x.unit || unit, unit));
      const add = (type, value, label, extra) => out.push(Object.assign({ id: U.uid('pr'), exerciseId: ex.id, type, value, label, sessionId: session.id, localDate: session.localDate }, extra || {}));
      if (ex.type === 'timed') {
        const best = Math.max.apply(null, now.map((x) => x.durationSec || 0));
        const was = Math.max.apply(null, prev.map((x) => x.durationSec || 0));
        if (best > was) add('longest_hold', best, best + ' s');
        return;
      }
      if (ex.loadConvention === 'none') {
        const best = Math.max.apply(null, now.map((x) => x.reps || 0));
        const was = Math.max.apply(null, prev.map((x) => x.reps || 0));
        if (best > was) add('best_reps', best, best + ' reps');
        return;
      }
      if (ex.type === 'assisted') {
        // lowest assistance at a rep count
        let best = null;
        now.forEach((x) => { if (x.load == null || x.reps == null) return; const was = prev.filter((y) => y.load != null && y.reps != null && y.reps >= x.reps).map(L); const floor = was.length ? Math.min.apply(null, was) : null; if (floor != null && L(x) < floor && (!best || L(x) < best.load)) best = { load: L(x), reps: x.reps }; });
        if (best) add('lowest_assistance', best.load, U.fmtLoad(best.load) + ' ' + unit + ' assist × ' + best.reps, { reps: best.reps });
        return;
      }
      // best load at reps
      let bl = null;
      now.forEach((x) => { if (x.load == null || x.reps == null) return; const was = prev.filter((y) => y.load != null && y.reps != null && y.reps >= x.reps).map(L); const top = was.length ? Math.max.apply(null, was) : 0; if (top > 0 && L(x) > top && (!bl || L(x) > bl.load || (L(x) === bl.load && x.reps > bl.reps))) bl = { load: L(x), reps: x.reps }; });
      if (bl) add('best_load_at_reps', bl.load, U.fmtLoad(bl.load) + ' × ' + bl.reps, { reps: bl.reps });
      // best reps at load (only if not already the same set as above)
      let br = null;
      now.forEach((x) => { if (x.load == null || x.reps == null) return; const was = prev.filter((y) => y.load != null && y.reps != null && L(y) >= L(x)).map((y) => y.reps); const top = was.length ? Math.max.apply(null, was) : 0; if (top > 0 && x.reps > top && (!br || x.reps > br.reps)) br = { load: L(x), reps: x.reps }; });
      if (br && !(bl && bl.load === br.load && bl.reps === br.reps)) add('best_reps_at_load', br.reps, br.reps + ' × ' + U.fmtLoad(br.load), { load: br.load });
      // most working sets at top of range
      const p = inst.prescription;
      if (p.repMax) {
        const cnt = now.filter((x) => x.reps != null && x.reps >= p.repMax).length;
        const was = Math.max.apply(null, [0].concat(earlier.map((s) => { const pi = s.exercises.find((e) => e.exerciseId === inst.exerciseId && !e.skipped); return pi ? D.logicalSets(pi, { completedOnly: true, kind: 'working' }).filter((x) => x.reps != null && x.reps >= (pi.prescription.repMax || p.repMax)).length : 0; })));
        if (cnt > was && cnt >= 2) add('most_top_sets', cnt, cnt + ' sets at ' + p.repMax);
      }
    });
    return out;
  };

  S.prsForSession = function (db, sessionId) { return (db.prs || []).filter((p) => p.sessionId === sessionId); };

  CS.stats = S;
})();


/* ===== core/storage.js ===== */
/* Coastal Strength — core/storage.js
   Local-first persistence. The whole database is one JSON document written atomically,
   so a retried write can never duplicate a set or a session.

   Backends, tried in order:
     1. window.storage  — the claude.ai preview's per-user key-value API (artifact sandbox)
     2. IndexedDB       — when hosted as a normal web page / iPhone home-screen app
     3. localStorage    — fallback
     4. memory          — nothing persists; the UI shows a warning
   None of these is cloud sync. Data lives on this device in this browser. */
(function () {
  const CS = (window.CS = window.CS || {});
  const KEY = 'cs:db';
  const ST = {};

  function previewBackend() {
    const w = window.storage;
    if (!w || typeof w.get !== 'function' || typeof w.set !== 'function') return null;
    return {
      mode: 'preview',
      label: 'Preview storage (claude.ai account, this artifact)',
      async probe() {
        const r = await w.set('cs:probe', '1', false);
        if (!r) throw new Error('preview storage set failed');
        try { await w.delete('cs:probe', false); } catch (e) { /* ignore */ }
        return true;
      },
      async load() {
        try {
          const r = await w.get(KEY, false);
          return r && r.value ? r.value : null;
        } catch (e) { return null; } // missing key throws
      },
      async save(json) {
        const r = await w.set(KEY, json, false);
        if (!r) throw new Error('Save rejected by preview storage');
      },
      async clear() { try { await w.delete(KEY, false); } catch (e) { /* ignore */ } }
    };
  }

  function idbBackend() {
    if (typeof indexedDB === 'undefined' || !indexedDB) return null;
    let dbp = null;
    function open() {
      if (dbp) return dbp;
      dbp = new Promise((resolve, reject) => {
        let req;
        try { req = indexedDB.open('coastal-strength', 1); } catch (e) { reject(e); return; }
        req.onupgradeneeded = () => { req.result.createObjectStore('kv'); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error('IndexedDB open failed'));
        req.onblocked = () => reject(new Error('IndexedDB blocked'));
      });
      return dbp;
    }
    function tx(mode, fn) {
      return open().then((db) => new Promise((resolve, reject) => {
        const t = db.transaction('kv', mode);
        const store = t.objectStore('kv');
        const req = fn(store);
        t.oncomplete = () => resolve(req ? req.result : undefined);
        t.onerror = () => reject(t.error || new Error('IndexedDB transaction failed'));
        t.onabort = () => reject(t.error || new Error('IndexedDB transaction aborted'));
      }));
    }
    return {
      mode: 'indexeddb',
      label: 'IndexedDB (this browser on this device)',
      async probe() { await tx('readonly', (s) => s.get('probe')); return true; },
      async load() { const v = await tx('readonly', (s) => s.get(KEY)); return v == null ? null : v; },
      async save(json) { await tx('readwrite', (s) => s.put(json, KEY)); },
      async clear() { await tx('readwrite', (s) => s.delete(KEY)); }
    };
  }

  function localBackend() {
    try {
      const ls = window.localStorage;
      if (!ls) return null;
      ls.setItem('cs:probe', '1'); ls.removeItem('cs:probe');
      return {
        mode: 'localstorage',
        label: 'localStorage (this browser on this device)',
        sync: true,
        async probe() { return true; },
        async load() { return ls.getItem(KEY); },
        async save(json) { ls.setItem(KEY, json); },
        saveSync(json) { ls.setItem(KEY, json); },
        async clear() { ls.removeItem(KEY); }
      };
    } catch (e) { return null; }
  }

  function memoryBackend() {
    let mem = null;
    return {
      mode: 'memory',
      label: 'Memory only — nothing is saved',
      async probe() { return true; },
      async load() { return mem; },
      async save(json) { mem = json; },
      async clear() { mem = null; }
    };
  }

  /* Pick the first backend that works. */
  ST.detect = async function (prefer) {
    const candidates = [previewBackend, idbBackend, localBackend, memoryBackend];
    for (const make of candidates) {
      const b = make();
      if (!b) continue;
      if (prefer && b.mode !== prefer && b.mode !== 'memory') continue;
      try {
        await Promise.race([b.probe(), new Promise((_, rej) => setTimeout(() => rej(new Error('probe timeout')), 1500))]);
        return b;
      } catch (e) { /* next */ }
    }
    return memoryBackend();
  };

  /* The store: in-memory db + listeners + debounced, serialized autosave. */
  ST.createStore = function (backend, opts) {
    opts = opts || {};
    const debounceMs = opts.debounceMs == null ? 250 : opts.debounceMs;
    const listeners = [];
    const statusListeners = [];
    let db = null;
    let status = { state: 'idle', at: null, message: '' };
    let timer = null, saving = false, dirtyAgain = false, retryTimer = null;

    function setStatus(s) { status = Object.assign({ at: Date.now() }, s); statusListeners.forEach((f) => f(status)); }

    const store = {
      backend,
      get db() { return db; },
      get status() { return status; },
      onChange(f) { listeners.push(f); return () => { const i = listeners.indexOf(f); if (i >= 0) listeners.splice(i, 1); }; },
      onStatus(f) { statusListeners.push(f); return () => { const i = statusListeners.indexOf(f); if (i >= 0) statusListeners.splice(i, 1); }; },

      async load() {
        const json = await backend.load();
        if (!json) { db = null; return null; }
        try {
          const parsed = JSON.parse(json);
          db = CS.db.migrate(parsed);
        } catch (e) {
          setStatus({ state: 'error', message: 'Stored data could not be read: ' + e.message });
          db = null;
        }
        return db;
      },

      /* Replace the db wholesale (onboarding, import). */
      set(next) { db = next; listeners.forEach((f) => f(db)); store.scheduleSave(); },

      /* Apply a mutation and autosave. Every UI write goes through here. */
      commit(fn, opts) {
        if (!db) return undefined;
        const r = fn(db);
        if (!(opts && opts.silent)) listeners.forEach((f) => f(db));
        store.scheduleSave();
        return r;
      },

      scheduleSave() {
        setStatus({ state: 'dirty', message: 'Unsaved changes' });
        if (timer) clearTimeout(timer);
        timer = setTimeout(() => { timer = null; store.flush(); }, debounceMs);
      },

      /* Serialized: one write at a time; a change during a write triggers one more write after it. */
      async flush() {
        if (!db) return;
        if (saving) { dirtyAgain = true; return; }
        if (timer) { clearTimeout(timer); timer = null; }
        saving = true;
        setStatus({ state: 'saving', message: 'Saving…' });
        try {
          db.savedAt = new Date().toISOString();
          await backend.save(JSON.stringify(db));
          setStatus({ state: 'saved', message: backend.mode === 'memory' ? 'Not saved — storage unavailable' : 'Saved' });
        } catch (e) {
          setStatus({ state: 'error', message: 'Save failed — retrying' });
          if (retryTimer) clearTimeout(retryTimer);
          retryTimer = setTimeout(() => { retryTimer = null; dirtyAgain = true; store.flush(); }, 2000);
        } finally {
          saving = false;
          if (dirtyAgain) { dirtyAgain = false; store.flush(); }
        }
      },

      /* Best-effort synchronous write for pagehide on backends that support it. */
      flushSync() {
        if (!db) return;
        if (backend.saveSync) { try { db.savedAt = new Date().toISOString(); backend.saveSync(JSON.stringify(db)); setStatus({ state: 'saved', message: 'Saved' }); } catch (e) { /* ignore */ } }
        else store.flush();
      },

      async clear() { db = null; if (timer) clearTimeout(timer); await backend.clear(); setStatus({ state: 'idle', message: '' }); }
    };
    return store;
  };

  CS.storage = ST;
})();

/* ===== ui/dom.js ===== */
/* Coastal Strength — ui/dom.js */
(function () {
  const CS = (window.CS = window.CS || {});
  const U = CS.util;
  const X = {};

  /* h('div.card.stack', { onClick }, child, [children], 'text') */
  X.h = function (spec, attrs) {
    const parts = spec.split('.');
    const el = document.createElement(parts[0] || 'div');
    if (parts.length > 1) el.className = parts.slice(1).join(' ');
    if (attrs && typeof attrs === 'object' && !(attrs instanceof Node) && !Array.isArray(attrs)) {
      Object.keys(attrs).forEach((k) => {
        const v = attrs[k];
        if (v == null || v === false) return;
        if (k === 'class') el.className += (el.className ? ' ' : '') + v;
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'text') el.textContent = v;
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'readOnly' || k === 'selected') el[k] = v;
        else el.setAttribute(k, v === true ? '' : v);
      });
    } else if (attrs != null) {
      X.append(el, attrs);
    }
    for (let i = 2; i < arguments.length; i++) X.append(el, arguments[i]);
    return el;
  };

  X.append = function (el, child) {
    if (child == null || child === false) return;
    if (Array.isArray(child)) { child.forEach((c) => X.append(el, c)); return; }
    if (child instanceof Node) { el.appendChild(child); return; }
    el.appendChild(document.createTextNode(String(child)));
  };

  X.clear = function (el) { while (el.firstChild) el.removeChild(el.firstChild); return el; };

  X.svg = function (html, cls) {
    const wrap = document.createElement('span');
    wrap.innerHTML = html;
    const s = wrap.firstElementChild;
    if (cls) s.setAttribute('class', cls);
    return s;
  };

  X.ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
    more: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
    today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    train: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 12h2M19 12h2M6 8v8M18 8v8M9 6v12M15 6v12M9 12h6"/></svg>',
    progress: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16M7 15l4-5 3 3 5-7"/></svg>',
    nutrition: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 3v7a3 3 0 0 0 6 0V3M9 3v18M16 3c-2 2-2 6 0 8v10"/></svg>',
    profile: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l12-7z"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };

  /* Bottom sheet. Returns { close }. */
  X.sheet = function (title, build) {
    const back = X.h('div.sheet-back', { role: 'dialog', 'aria-modal': 'true', 'aria-label': title || 'Options' });
    const sh = X.h('div.sheet');
    const api = { close() { if (back.parentNode) back.parentNode.removeChild(back); document.removeEventListener('keydown', onKey); } };
    function onKey(e) { if (e.key === 'Escape') api.close(); }
    back.addEventListener('click', (e) => { if (e.target === back) api.close(); });
    document.addEventListener('keydown', onKey);
    if (title) sh.appendChild(X.h('h2', { text: title }));
    build(sh, api);
    back.appendChild(sh);
    document.body.appendChild(back);
    const first = sh.querySelector('button, input, select, textarea');
    if (first) setTimeout(() => first.focus(), 30);
    return api;
  };

  /* Action list sheet: items = [{label, onSelect, danger, hint}] */
  X.actionSheet = function (title, items) {
    return X.sheet(title, (sh, api) => {
      const list = X.h('div.list');
      items.filter(Boolean).forEach((it) => {
        list.appendChild(X.h('button', { class: it.danger ? 'danger' : '', onClick: () => { api.close(); it.onSelect(); } },
          X.h('span', { text: it.label }), it.hint ? X.h('span.small.muted', { text: it.hint }) : null));
      });
      sh.appendChild(list);
      sh.appendChild(X.h('button.btn.block', { style: { marginTop: '10px' }, onClick: api.close, text: 'Cancel' }));
    });
  };

  /* Confirm sheet. opts: { title, body, confirmLabel, danger, typed } -> Promise<boolean> */
  X.confirm = function (opts) {
    return new Promise((resolve) => {
      X.sheet(opts.title, (sh, api) => {
        if (opts.body) sh.appendChild(X.h('p.muted', { text: opts.body, style: { marginBottom: '14px' } }));
        let typedOk = !opts.typed;
        let btn;
        if (opts.typed) {
          const inp = X.h('input.input', { type: 'text', placeholder: 'Type ' + opts.typed + ' to confirm', autocomplete: 'off', 'aria-label': 'Type ' + opts.typed + ' to confirm' });
          inp.addEventListener('input', () => { typedOk = inp.value.trim().toUpperCase() === opts.typed.toUpperCase(); btn.disabled = !typedOk; });
          sh.appendChild(X.h('div.field', { style: { marginBottom: '12px' } }, inp));
        }
        btn = X.h('button.btn.block', { class: opts.danger ? 'danger solid' : 'primary', disabled: !typedOk, onClick: () => { api.close(); resolve(true); }, text: opts.confirmLabel || 'Confirm' });
        sh.appendChild(btn);
        sh.appendChild(X.h('button.btn.block', { style: { marginTop: '8px' }, onClick: () => { api.close(); resolve(false); }, text: opts.cancelLabel || 'Cancel' }));
      });
    });
  };

  /* Prompt sheet -> Promise<string|null> */
  X.prompt = function (opts) {
    return new Promise((resolve) => {
      X.sheet(opts.title, (sh, api) => {
        const inp = X.h(opts.multiline ? 'textarea.input' : 'input.input', { type: opts.type || 'text', value: opts.value || '', placeholder: opts.placeholder || '', inputmode: opts.inputmode, 'aria-label': opts.title });
        if (opts.help) sh.appendChild(X.h('p.help', { text: opts.help, style: { marginBottom: '10px' } }));
        sh.appendChild(X.h('div.field', { style: { marginBottom: '12px' } }, inp));
        sh.appendChild(X.h('button.btn.block.primary', { onClick: () => { api.close(); resolve(inp.value); }, text: opts.confirmLabel || 'Save' }));
        sh.appendChild(X.h('button.btn.block', { style: { marginTop: '8px' }, onClick: () => { api.close(); resolve(null); }, text: 'Cancel' }));
      });
    });
  };

  let toastTimer = null;
  X.toast = function (msg, ms) {
    const old = document.querySelector('.toast');
    if (old) old.remove();
    const t = X.h('div.toast', { role: 'status', text: msg });
    document.body.appendChild(t);
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.remove(), ms || 2200);
  };

  /* Numeric input bound to a setter. opts: { value, integer, max, placeholder, cls, label, onValue(value|null), inputmode } */
  X.numInput = function (opts) {
    const inp = X.h('input', {
      class: opts.cls || 'input', type: 'text', inputmode: opts.inputmode || (opts.integer ? 'numeric' : 'decimal'),
      pattern: opts.integer ? '[0-9]*' : '[0-9]*[.,]?[0-9]*', autocomplete: 'off', enterkeyhint: 'done',
      placeholder: opts.placeholder || '', 'aria-label': opts.label || '', value: opts.value == null ? '' : String(opts.value)
    });
    inp.addEventListener('focus', () => { try { inp.select(); } catch (e) { /* ignore */ } setTimeout(() => { try { inp.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { /* ignore */ } }, 250); });
    inp.addEventListener('input', () => {
      const r = U.parseNum(inp.value, { integer: opts.integer, max: opts.max });
      inp.classList.toggle('invalid', !!r.error);
      inp.classList.remove('prefilled');
      if (r.error) { inp.setAttribute('aria-invalid', 'true'); inp.title = r.error; if (opts.onError) opts.onError(r.error); return; }
      inp.removeAttribute('aria-invalid'); inp.title = '';
      if (opts.onError) opts.onError(null);
      opts.onValue(r.value);
    });
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') inp.blur(); });
    return inp;
  };

  /* Plate math: plates per side for a target total on a bar. */
  X.plateMath = function (target, bar, plates) {
    if (target == null || target < bar) return { perSide: [], remainder: target == null ? null : target - bar, exact: false };
    let perSide = (target - bar) / 2;
    const out = [];
    plates.slice().sort((a, b) => b - a).forEach((p) => {
      while (perSide + 1e-9 >= p) { out.push(p); perSide -= p; }
    });
    return { perSide: out, remainder: Math.round(perSide * 100) / 100, exact: Math.abs(perSide) < 1e-6 };
  };

  X.PLATES = { lb: [45, 35, 25, 10, 5, 2.5], kg: [25, 20, 15, 10, 5, 2.5, 1.25] };
  X.BARS = { lb: [45, 35, 15], kg: [20, 15, 10] };

  CS.dom = X;
})();

/* Coastal Strength — ui/brand.js */
(function () {
  const CS = (window.CS = window.CS || {});
  const X = CS.dom;
  const B = {};

  B.MARK_PATH = 'M37 27.5 C46 27 52 18.5 45.5 12 C36 5 17.5 9 13.5 24 C9.5 40 18 54 34 55 C43 55.6 50.5 50 55 41';

  B.mark = function (size, color) {
    return X.svg('<svg viewBox="0 0 64 64" width="' + (size || 24) + '" height="' + (size || 24) + '" aria-hidden="true"><path d="' + B.MARK_PATH + '" fill="none" stroke="' + (color || 'var(--accent)') + '" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>');
  };

  /* Week ring: completed / scheduled. Accent only when something is earned. */
  B.ring = function (completed, scheduled, size) {
    const r = 28, c = 2 * Math.PI * r;
    const frac = scheduled > 0 ? completed / scheduled : 0;
    const dash = (c * frac).toFixed(2) + ' ' + (c * (1 - frac)).toFixed(2);
    return X.svg(
      '<svg viewBox="0 0 72 72" width="' + (size || 72) + '" height="' + (size || 72) + '" role="img" aria-label="' + completed + ' of ' + scheduled + ' scheduled lifting sessions completed this week">' +
      '<circle cx="36" cy="36" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="7"/>' +
      (completed > 0 ? '<circle cx="36" cy="36" r="' + r + '" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + dash + '" transform="rotate(-90 36 36)"/>' : '') +
      '<text x="36" y="41" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor">' + completed + '/' + scheduled + '</text></svg>');
  };

  /* Rep-range bar: where a set sits inside [repMin, repMax]. */
  B.rangeBar = function (reps, repMin, repMax) {
    const wrap = X.h('div.rangebar', { role: 'img', 'aria-label': reps == null ? 'No reps logged' : reps + ' reps in a ' + repMin + ' to ' + repMax + ' range' });
    const span = Math.max(1, repMax - repMin);
    if (reps != null) {
      const frac = Math.max(0, Math.min(1, (reps - repMin + 1) / (span + 1)));
      wrap.appendChild(X.h('div.fill', { style: { width: (frac * 100).toFixed(1) + '%' } }));
    }
    return wrap;
  };

  CS.brand = B;
})();

      h('button.btn.sm.primary', { onClick: () => finishFlow(app, session), text: C.logger.finish })));
    wrap.appendChild(head);

    const dots = h('div.dots', { role: 'tablist' });
    session.exercises.forEach((e, i) => {
      const done = !e.skipped && D.logicalSets(e, { completedOnly: true, kind: 'working' }).length >= e.prescription.sets;
      dots.appendChild(h('i', { class: (i === idx ? 'cur ' : '') + (done ? 'done ' : '') + (e.skipped ? 'skip' : ''), role: 'tab', 'aria-selected': i === idx ? 'true' : 'false', 'aria-label': D.exercise(db, e.exerciseId).name, onClick: () => { TR.setFocus(sid, i); app.render(); } }));
    });
    wrap.appendChild(dots);

    if (inst) wrap.appendChild(exerciseFocus(app, session, inst));

    const nav = h('div.nav');
    nav.appendChild(h('button.btn', { disabled: idx === 0, 'aria-label': 'Previous', onClick: () => { TR.setFocus(sid, idx - 1); app.render(); }, text: '‹' }));
    nav.appendChild(h('span.tiny.muted', { text: (idx + 1) + ' / ' + session.exercises.length }));
    nav.appendChild(h('button.btn', { disabled: idx >= session.exercises.length - 1, 'aria-label': 'Next', onClick: () => { TR.setFocus(sid, idx + 1); app.render(); }, text: '›' }));
    wrap.appendChild(nav);

    // Swipe between exercises
    let x0 = null, y0 = null;
    wrap.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
    wrap.addEventListener('touchend', (e) => {
      if (x0 == null) return;
      const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      x0 = null;
      if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;
      const to = idx + (dx < 0 ? 1 : -1);
      if (to >= 0 && to < session.exercises.length) { TR.setFocus(sid, to); app.render(); }
    }, { passive: true });

    root.appendChild(wrap);
  }

  function loadHint(ex) {
    return { per_dumbbell: C.logger.perDb, total_bar: C.logger.bar, machine_stack: C.logger.stack, assistance: C.logger.assist, added: C.logger.added, none: '' }[ex.loadConvention] || '';
  }
  function fmtLast(sets, ex) {
    if (ex.type === 'timed') return sets.map((s) => (s.durationSec == null ? '—' : s.durationSec)).join(', ') + ' s';
    const reps = sets.map((s) => (s.reps == null ? '—' : s.reps)).join(', ');
    if (ex.loadConvention === 'none') return reps;
    const loads = sets.map((s) => s.load);
    if (loads.every((l) => l === loads[0])) return (loads[0] == null ? '—' : U.fmtLoad(loads[0])) + ' × ' + reps;
    return sets.map((s) => (s.load == null ? '—' : U.fmtLoad(s.load)) + '×' + (s.reps == null ? '—' : s.reps)).join(', ');
  }

  function exerciseFocus(app, session, inst) {
    const db = app.store.db;
    const sid = session.id;
    const ex = D.exercise(db, inst.exerciseId);
    const p = inst.prescription;
    const card = h('div', { 'data-inst': inst.instanceId });
    const range = ex.type === 'timed' && p.timed ? p.timed.secMin + '–' + p.timed.secMax + ' s' : p.repMin + '–' + p.repMax;

    card.appendChild(h('div.row.between', h('div.grow', h('div.exname', { text: ex.name }), h('div.exmeta', { text: p.sets + ' × ' + range + (p.perSide ? ' / side' : '') + ' · ' + C.logger.rest + ' ' + U.fmtClock(inst.restSec) })),
      h('button.btn.icon.sm', { 'aria-label': ex.name, onClick: () => exerciseMenu(app, session, inst) }, X.svg(X.ICON.more))));

    if (inst.skipped) {
      card.appendChild(h('div.row.between', { style: { marginTop: '14px' } }, h('span.muted', { text: C.logger.skipped }), h('button.btn.sm', { onClick: () => { app.store.commit((d) => D.unskipExercise(d, sid, inst.instanceId)); app.render(); }, text: C.logger.unskip })));
      return card;
    }

    const lp = inst.lastPerformance;
    const unit = (inst.sets[0] && inst.sets[0].unit) || db.profile.units;
    card.appendChild(h('div.lastline', { text: lp && lp.sets.length ? C.logger.last + ' ' + fmtLast(lp.sets, ex) : C.logger.noHistory }));

    const sg = inst.suggestionKey ? db.suggestions[inst.suggestionKey] : null;
    if (sg && sg.result && (sg.result.status === 'increase' || sg.result.status === 'assist_decrease') && sg.result.suggestedLoad != null && !sg.decision) {
      card.appendChild(h('div.target',
        h('span.grow', { text: U.fmtLoad(sg.result.suggestedLoad) + ' ' + sg.result.unit + ' · ' + range }),
        h('button.btn.xs.primary', { onClick: () => { app.store.commit((d) => { D.decideSuggestion(d, sg.key, 'accepted'); const i2 = D.instance(d, sid, inst.instanceId); i2.sets.forEach((s) => { if (!s.completed && s.kind === 'working') { s.load = sg.result.suggestedLoad; s.prefilled = true; } }); }); app.render(); }, text: C.logger.use }),
        h('button.btn.xs', { onClick: () => { app.store.commit((d) => D.decideSuggestion(d, sg.key, 'dismissed')); app.render(); }, text: C.logger.hold }),
        h('button.ibtn', { 'aria-label': C.logger.why, onClick: () => showReasons(ex, sg.result), text: 'i' })));
    }

    const sets = h('div.sets');
    const curId = (inst.sets.find((s) => s.kind === 'working' && !s.completed) || {}).id;
    let w = 0, wu = 0; const pairN = {};
    inst.sets.forEach((s) => {
      let label;
      if (s.kind === 'warmup') { if (s.side !== 'R') wu++; label = 'W' + wu; }
      else if (s.pairId) { if (!(s.pairId in pairN)) pairN[s.pairId] = ++w; label = String(pairN[s.pairId]); }
      else label = String(++w);
      sets.appendChild(setRow(app, session, inst, ex, s, label, s.id === curId));
    });
    card.appendChild(sets);

    const acts = h('div.actions');
    if (lp && lp.sets.length && inst.sets.some((s) => s.kind === 'working' && !s.completed && (s.load != null || s.reps != null || s.durationSec != null)))
      acts.appendChild(h('button.btn.sm', { onClick: () => sameAsLast(app, session, inst), text: C.logger.sameAsLast }));
    acts.appendChild(h('button.btn.sm', { onClick: () => { app.store.commit((d) => D.addSet(d, sid, inst.instanceId, 'working')); app.render(); }, text: '+ ' + C.logger.addSet }));
    acts.appendChild(h('button.btn.sm', { onClick: () => { app.store.commit((d) => D.addSet(d, sid, inst.instanceId, 'warmup')); app.render(); }, text: '+ ' + C.logger.warmup }));
    if (ex.type === 'barbell') acts.appendChild(h('button.btn.sm', { onClick: () => plateSheet(inst, unit), text: C.logger.plates }));
    card.appendChild(acts);
    if (inst.notes) card.appendChild(h('p.small.muted', { style: { marginTop: '10px' }, text: inst.notes }));
    return card;
  }

  function setRow(app, session, inst, ex, s, label, isCur) {
    const db = app.store.db;
    const sid = session.id, iid = inst.instanceId;
    const p = inst.prescription;
    const usesLoad = ex.loadConvention !== 'none';
    const timed = ex.type === 'timed';
    const inc = (s.unit === 'kg' ? ex.incrementKg : ex.incrementLb) || 1;
    const row = h('div.setrow', { class: (s.completed ? 'done ' : '') + (isCur ? 'cur ' : '') + (s.kind === 'warmup' ? 'warm' : '') });

    const lbl = h('button.setlabel', { type: 'button', 'aria-label': (s.kind === 'warmup' ? C.logger.warm : C.logger.working) + ' ' + label, onClick: () => setSheet(app, session, inst, s, label) }, label + (s.side !== 'both' ? s.side : ''));
    if (db.settings.showRir && s.rir != null) lbl.appendChild(h('small', { text: 'RIR ' + s.rir }));
    else if (s.kind === 'warmup') lbl.appendChild(h('small', { text: 'W' }));
    longPress(lbl, () => { app.store.commit((d) => D.setKind(d, sid, iid, s.id, s.kind === 'warmup' ? 'working' : 'warmup')); app.render(); });
    row.appendChild(lbl);

    const silent = (fn) => app.store.commit(fn, { silent: true });
    function stepper(field, value, step, integer, placeholder, ariaLabel) {
      const wrap = h('div.stepper');
      const inp = X.numInput({ value, integer, cls: 'setinput' + (s.prefilled ? ' prefilled' : ''), placeholder, max: field === 'load' ? 5000 : 3600, label: ariaLabel, onValue: (v) => silent((d) => D.setField(d, sid, iid, s.id, field, v)) });
      const bump = (dir) => { const next = app.store.commit((d) => D.stepField(d, sid, iid, s.id, field, dir * step), { silent: true }); inp.value = next == null ? '' : String(next); inp.classList.remove('prefilled'); };
      wrap.appendChild(h('button.step', { type: 'button', 'aria-label': '−' + step + ' ' + ariaLabel, onClick: () => bump(-1), text: '−' }));
      wrap.appendChild(inp);
      wrap.appendChild(h('button.step', { type: 'button', 'aria-label': '+' + step + ' ' + ariaLabel, onClick: () => bump(1), text: '+' }));
      return wrap;
    }
    if (usesLoad) row.appendChild(stepper('load', s.load, inc, false, '—', loadHint(ex) || 'load'));
    else row.appendChild(h('div.convention', { text: timed ? '' : C.logger.bw }));
    if (timed) row.appendChild(stepper('durationSec', s.durationSec, 5, true, p.timed ? p.timed.secMin + '–' + p.timed.secMax : 's', 's'));
    else row.appendChild(stepper('reps', s.reps, 1, true, p.repMin != null ? p.repMin + '–' + p.repMax : '', 'reps'));

    row.appendChild(h('button.setcheck', { class: s.completed ? 'on' : '', type: 'button', 'aria-pressed': s.completed ? 'true' : 'false', 'aria-label': label, onClick: () => {
      let nowDone = false;

        nowDone = D.toggleComplete(d, sid, iid, s.id, nowIso());
        if (nowDone && d.settings.autoStartRest && s.kind === 'working') D.startRest(d, inst.restSec, Date.now(), sid);
      });
      if (nowDone) app.haptic(10);
      app.render(); app.renderTimer();
    } }, X.svg(X.ICON.check)));
    return row;
  }

  function longPress(el, fn) {
    let t = null;
    const start = () => { t = setTimeout(() => { t = null; fn(); }, 500); };
    const cancel = () => { if (t) { clearTimeout(t); t = null; } };
    el.addEventListener('touchstart', start, { passive: true }); el.addEventListener('touchend', cancel); el.addEventListener('touchmove', cancel);
    el.addEventListener('mousedown', start); el.addEventListener('mouseup', cancel); el.addEventListener('mouseleave', cancel);
  }

  function sameAsLast(app, session, inst) {

    app.store.commit((d) => {
      ids = D.completePrefilled(d, session.id, inst.instanceId, nowIso());
      if (ids.length && d.settings.autoStartRest) D.startRest(d, inst.restSec, Date.now(), session.id);
    });

    app.haptic(10);
    app.render(); app.renderTimer();
    const pill = h('div.undo', { role: 'status' }, h('span', { text: ids.length + ' ✓' }), h('button', { onClick: () => { app.store.commit((d) => { D.uncompleteSets(d, session.id, inst.instanceId, ids); D.dismissRest(d); }); pill.remove(); app.render(); app.renderTimer(); }, text: C.logger.undo }));

  function setSheet(app, session, inst, s, label) {

        h('button.chip', { type: 'button', 'aria-pressed': s.kind === 'warmup' ? 'true' : 'false', onClick: () => { app.store.commit((d) => D.setKind(d, sid, iid, s.id, 'warmup')); api.close(); app.render(); }, text: C.logger.warm })));
      sh.appendChild(h('div.field', { style: { marginTop: '12px' } }, h('label', { text: C.logger.rir }), X.numInput({ value: s.rir, integer: true, max: 10, cls: 'input', label: C.logger.rir, onValue: (v) => app.store.commit((d) => D.setField(d, sid, iid, s.id, 'rir', v), { silent: true }) })));
      sh.appendChild(h('div.field', { style: { marginTop: '12px' } }, h('label', { text: C.logger.notes }), h('input.input', { type: 'text', value: s.notes || '', 'aria-label': C.logger.notes, onInput: (e) => app.store.commit((d) => D.setField(d, sid, iid, s.id, 'notes', e.target.value), { silent: true }) })));
      sh.appendChild(h('button.btn.block', { style: { marginTop: '14px' }, onClick: () => { api.close(); app.render(); }, text: C.logger.close }));
      sh.appendChild(h('button.btn.block.danger', { style: { marginTop: '8px' }, onClick: async () => {

  function showReasons(ex, result) {
    X.sheet(ex.name, (sh, api) => {
      sh.appendChild(h('p', { text: headline(result) }));
      const ul = h('ul.reasons');

      sh.appendChild(ul);

    });
  }
  function headline(r) {

      case 'increase': return U.fmtLoad(r.currentLoad) + ' → ' + U.fmtLoad(r.suggestedLoad) + ' ' + r.unit;
      case 'assist_decrease': return r.suggestedLoad == null ? '0 ' + C.logger.assist : U.fmtLoad(r.currentLoad) + ' → ' + U.fmtLoad(r.suggestedLoad) + ' ' + r.unit + ' ' + C.logger.assist;
      case 'bodyweight_top': case 'timed_top': return '↑';
      case 'not_evaluated': return '—';
      default: return C.logger.hold + (r.currentLoad != null ? ' ' + U.fmtLoad(r.currentLoad) + ' ' + r.unit : '');

  function overviewSheet(app, session) {

    X.sheet(session.templateName, (sh, api) => {
      const list = h('div.list');

        list.appendChild(h('div', { class: 'ovrow' },
          h('button', { class: 'ovname', style: { background: 'none', border: 0, padding: 0, textAlign: 'left', flex: '1', color: inst.skipped ? 'var(--muted)' : 'inherit', textDecoration: inst.skipped ? 'line-through' : 'none' }, onClick: () => { api.close(); TR.setFocus(session.id, i); app.render(); }, text: ex.name }),
          h('span', { class: done >= inst.prescription.sets ? 'sand' : 'muted', text: done + '/' + inst.prescription.sets }),
          h('button.ibtn', { 'aria-label': C.logger.up, disabled: i === 0, onClick: () => { app.store.commit((d) => D.moveExercise(d, session.id, inst.instanceId, -1)); api.close(); overviewSheet(app, db.sessions[session.id]); }, text: '↑' }),
          h('button.ibtn', { 'aria-label': C.logger.down, disabled: i === session.exercises.length - 1, onClick: () => { app.store.commit((d) => D.moveExercise(d, session.id, inst.instanceId, 1)); api.close(); overviewSheet(app, db.sessions[session.id]); }, text: '↓' })));
      });
      sh.appendChild(list);
      sh.appendChild(h('button.btn.block', { style: { marginTop: '10px' }, onClick: () => { api.close(); app.navigate('train', { view: 'week' }); }, text: C.week.title }));
