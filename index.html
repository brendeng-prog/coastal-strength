  function exerciseMenu(app, session, inst) {
    const db = app.store.db;
    const sid = session.id, iid = inst.instanceId;
    const ex = D.exercise(db, inst.exerciseId);
    const anyDone = inst.sets.some((s) => s.completed);
    X.actionSheet(ex.name, [
      ex.cues && { label: C.logger.cues, hint: ex.cues, onSelect: () => {} },
      !inst.skipped && { label: C.logger.skip, onSelect: async () => { const r = await X.prompt({ title: C.logger.reason, confirmLabel: C.logger.skip }); if (r === null) return; app.store.commit((d) => D.skipExercise(d, sid, iid, r.trim())); app.render(); } },
      !anyDone && { label: C.logger.substitute, hint: C.logger.thisSession, onSelect: () => substituteSheet(app, session, inst) },
      ex.unilateral && { label: C.logger.sides, hint: inst.sidesSeparate ? C.logger.separate : C.logger.linked, onSelect: () => { app.store.commit((d) => D.setSidesSeparate(d, sid, iid, !inst.sidesSeparate)); app.render(); } },
      { label: C.logger.restTimer, hint: U.fmtClock(inst.restSec), onSelect: async () => { const v = await X.prompt({ title: C.logger.restTimer, value: String(inst.restSec), inputmode: 'numeric' }); if (v === null) return; const r = U.parseNum(v, { integer: true, max: 3600 }); if (r.error || r.value == null) { X.toast(C.errors.number); return; } app.store.commit((d) => D.setInstanceField(d, sid, iid, 'restSec', r.value)); app.render(); } },
      { label: C.logger.notes, hint: inst.notes ? '✓' : '', onSelect: async () => { const v = await X.prompt({ title: C.logger.notes, value: inst.notes || '', multiline: true }); if (v === null) return; app.store.commit((d) => D.setInstanceField(d, sid, iid, 'notes', v.trim())); app.render(); } }
    ]);
  }

  function substituteSheet(app, session, inst) {
    const db = app.store.db;
    const ex = D.exercise(db, inst.exerciseId);
    const all = Object.values(db.exercises).filter((e) => e.id !== ex.id);
    const family = all.filter((e) => e.family && e.family === ex.family);
    const rest = all.filter((e) => family.indexOf(e) < 0).sort((a, b) => a.name.localeCompare(b.name));
    X.sheet(C.logger.substitute, (sh, api) => {
      const list = h('div.list');
      family.concat(rest).forEach((e) => list.appendChild(h('button', { onClick: () => { api.close(); app.store.commit((d) => D.substituteExercise(d, session.id, inst.instanceId, e.id)); app.render(); } }, h('span', { text: e.name }), h('span.small.muted', { text: family.indexOf(e) >= 0 ? '≈' : '' }))));
      sh.appendChild(list);
    });
  }

  function plateSheet(inst, unit) {
    const bars = X.BARS[unit], plates = X.PLATES[unit];
    let target = (inst.sets.find((s) => s.kind === 'working' && s.load != null) || {}).load || null, bar = bars[0];
    X.sheet(C.logger.plates, (sh, api) => {
      const out = h('div', { style: { marginTop: '12px', fontSize: '22px', fontWeight: '600' } });
      function calc() {
        X.clear(out);
        if (target == null || target < bar) { out.appendChild(h('span.muted', { text: '—' })); return; }
        const r = X.plateMath(target, bar, plates);
        out.appendChild(h('span', { text: r.perSide.length ? r.perSide.map(U.fmtLoad).join(' + ') : '0' }));
        if (!r.exact) out.appendChild(h('span.small.muted', { text: '  ≈ ' + U.fmtLoad(bar + 2 * r.perSide.reduce((a, b) => a + b, 0)) }));
      }
      sh.appendChild(X.numInput({ value: target, cls: 'input', max: 5000, label: unit, onValue: (v) => { target = v; calc(); } }));
      const bc = h('div.chips', { style: { marginTop: '10px' } });
      bars.forEach((b) => bc.appendChild(h('button.chip.sm', { type: 'button', 'aria-pressed': b === bar ? 'true' : 'false', onClick: () => { bar = b; Array.from(bc.children).forEach((c) => c.setAttribute('aria-pressed', c.textContent === String(b) ? 'true' : 'false')); calc(); }, text: String(b) })));
      sh.appendChild(bc); sh.appendChild(out); calc();
      sh.appendChild(h('button.btn.block', { style: { marginTop: '14px' }, onClick: api.close, text: C.logger.close }));
    });
  }

  function finishFlow(app, session) {
    const c = D.counts(session);
    X.confirm({ title: C.logger.finishQ, body: c.workingDone + ' / ' + c.workingPrescribed, confirmLabel: C.logger.finish, cancelLabel: C.logger.cancel }).then((ok) => {
      if (!ok) return;
      app.store.commit((d) => D.finishSession(d, session.id, nowIso()));
      delete focusIdx[session.id];
      if (S.prsForSession(app.store.db, session.id).length) app.haptic([30, 60, 30]);
      app.navigate('train', { view: 'summary', sessionId: session.id });
    });
  }

  /* ---------- summary (PRs first) ---------- */
  function topSet(sets) {
    let best = null;
    sets.forEach((s) => { if (!best) { best = s; return; } const a = s.load == null ? -1 : s.load, b = best.load == null ? -1 : best.load; if (a > b || (a === b && (s.reps || 0) > (best.reps || 0))) best = s; });
    return best;
  }

  function renderSummary(root, app, session) {
    const db = app.store.db;
    const c = D.counts(session);
    const wrap = h('div.summ');
    wrap.appendChild(h('h1', { text: session.templateName }));
    wrap.appendChild(h('p.small.muted', { text: U.fmtLocalDate(session.localDate, { weekday: 'short', month: 'short', day: 'numeric' }) }));
    wrap.appendChild(h('div.row', { style: { gap: '24px', margin: '14px 0 6px' } },
      h('div', h('div.stat', { text: c.workingDone + ' / ' + c.workingPrescribed }), h('div.tiny.muted', { text: C.summary.sets })),
      h('div', h('div.stat', { text: U.fmtDuration(D.activeMs(session, Date.now())) }))));

    const prs = S.prsForSession(db, session.id);
    if (prs.length) {
      wrap.appendChild(h('div.section.sand', { text: C.summary.pr }));
      prs.forEach((pr) => wrap.appendChild(h('div.prline', h('span', { text: D.exercise(db, pr.exerciseId).name }), h('span.v', { text: pr.label }))));
    }

    const prev = D.sessionList(db).filter((s) => s.id !== session.id && s.templateId === session.templateId && s.status === 'completed' && (s.finishedAt || '') < (session.finishedAt || '9')).slice(-1)[0];
    wrap.appendChild(h('div.section', { text: C.summary.next }));
    session.exercises.forEach((inst) => {
      if (inst.skipped) return;
      const ex = D.exercise(db, inst.exerciseId);
      const sg = db.suggestions[session.id + ':' + inst.instanceId];
      const r = sg && sg.result;
      const now = topSet(D.logicalSets(inst, { completedOnly: true, kind: 'working' }));
      const pi = prev && prev.exercises.find((e) => e.exerciseId === inst.exerciseId && !e.skipped);
      const then = pi ? topSet(D.logicalSets(pi, { completedOnly: true, kind: 'working' })) : null;
      const f = (s) => !s ? '—' : ex.type === 'timed' ? (s.durationSec == null ? '—' : s.durationSec + ' s') : (s.load != null ? U.fmtLoad(s.load) + ' × ' : '') + (s.reps == null ? '—' : s.reps);
      const line = h('div.nextline');
      line.appendChild(h('div', h('div', { text: ex.name }), h('div.t', { text: (then ? f(then) + ' → ' : '') + f(now) })));
      const right = h('div.row');
      if (r && (r.status === 'increase' || r.status === 'assist_decrease') && r.suggestedLoad != null) {
        if (!sg.decision) {
          right.appendChild(h('button.btn.xs.primary', { onClick: () => { app.store.commit((d) => D.decideSuggestion(d, sg.key, 'accepted')); app.render(); }, text: C.summary.use + ' ' + U.fmtLoad(r.suggestedLoad) }));
          right.appendChild(h('button.btn.xs', { onClick: () => { app.store.commit((d) => D.decideSuggestion(d, sg.key, 'dismissed')); app.render(); }, text: C.summary.hold }));
          right.appendChild(h('button.btn.xs', { onClick: async () => { const v = await X.prompt({ title: r.unit, value: String(r.suggestedLoad), inputmode: 'decimal', confirmLabel: C.summary.use }); if (v === null) return; const n = U.parseNum(v, { max: 5000 }); if (n.error || n.value == null) { X.toast(C.errors.number); return; } app.store.commit((d) => D.decideSuggestion(d, sg.key, 'overridden', n.value)); app.render(); }, text: C.summary.edit }));
        } else {
          right.appendChild(h('span.small', { class: sg.decision === 'dismissed' ? 'muted' : 'sand', text: sg.decision === 'dismissed' ? C.summary.hold : U.fmtLoad(sg.appliedLoad) + ' ' + sg.unit }));
          right.appendChild(h('button.ibtn', { 'aria-label': C.summary.edit, onClick: () => { app.store.commit((d) => { const g = d.suggestions[sg.key]; g.decision = null; g.appliedLoad = null; }); app.render(); }, text: '↺' }));
        }
      } else if (r) right.appendChild(h('span.small.muted', { text: headline(r) }));
      if (r) right.appendChild(h('button.ibtn', { 'aria-label': C.summary.why, onClick: () => showReasons(ex, r), text: 'i' }));
      line.appendChild(right);
      wrap.appendChild(line);
    });

    [['energy', C.summary.energy], ['difficulty', C.summary.effort], ['soreness', C.summary.soreness]].forEach(([k, label]) => {
      wrap.appendChild(h('div.section', { text: label }));
      const sc = h('div.scale');
      for (let i = 1; i <= 5; i++) sc.appendChild(h('button.chip', { type: 'button', 'aria-pressed': session[k] === i ? 'true' : 'false', onClick: () => { app.store.commit((d) => D.setSessionField(d, session.id, k, session[k] === i ? null : i)); app.render(); }, text: String(i) }));
      wrap.appendChild(sc);
    });
    wrap.appendChild(h('div.section', { text: C.summary.notes }));
    wrap.appendChild(h('textarea.input', { 'aria-label': C.summary.notes, onInput: (e) => app.store.commit((d) => D.setSessionField(d, session.id, 'notes', e.target.value), { silent: true }) }, session.notes || ''));
    wrap.appendChild(h('button.btn.primary.block', { style: { marginTop: '16px' }, onClick: () => app.navigate('today'), text: C.summary.done }));
    root.appendChild(wrap);
  }

  /* ---------- rest timer ---------- */
  TR.renderTimer = function (bar, app) {
    const db = app.store.db;
    X.clear(bar);
    if (!db || !db.timer) { bar.hidden = true; return; }
    const st = D.restState(db, Date.now());
    bar.hidden = false;
    bar.className = 'timerbar' + (st.done ? ' done' : '');
    const frac = st.durationSec ? Math.max(0, Math.min(1, 1 - st.remainingSec / st.durationSec)) : 0;
    bar.appendChild(h('div.bar', { style: { width: (frac * 100).toFixed(1) + '%' } }));
    const inner = h('div.inner');
    inner.appendChild(h('div.clock', { id: 'restclock', text: st.done ? C.logger.restDone : U.fmtClock(st.remainingSec) }));
    inner.appendChild(h('div.grow'));
    inner.appendChild(h('button.btn.sm', { 'aria-label': '−15', onClick: () => { app.store.commit((d) => D.adjustRest(d, -15, Date.now())); app.renderTimer(); }, text: '−15' }));
    inner.appendChild(h('button.btn.sm', { 'aria-label': '+15', onClick: () => { app.store.commit((d) => D.adjustRest(d, 15, Date.now())); app.renderTimer(); }, text: '+15' }));
    inner.appendChild(h('button.btn.sm', { onClick: () => { app.store.commit((d) => D.dismissRest(d)); app.renderTimer(); }, text: C.logger.skip }));
    bar.appendChild(inner);
  };

  /* Called each tick: when the rest ends and the focused exercise is complete, move on. */
  TR.onRestDone = function (app) {
    const db = app.store.db;
    const active = D.findActiveSession(db);
    if (!active || app.tab !== 'train') return;
    const idx = currentIdx(active);
    const inst = active.exercises[idx];
    if (!inst || inst.skipped) return;
    if (D.logicalSets(inst, { completedOnly: true, kind: 'working' }).length < inst.prescription.sets) return;
    const next = active.exercises.findIndex((e, i) => i > idx && !e.skipped && D.logicalSets(e, { completedOnly: true, kind: 'working' }).length < e.prescription.sets);
    if (next > idx) { TR.setFocus(active.id, next); app.render(); }
  };

  CS.train = TR;
})();

/* ===== ui/app.js ===== */
/* Coastal Strength — ui/app.js (v2) */
(function () {
  const CS = (window.CS = window.CS || {});
  const X = CS.dom, U = CS.util, D = CS.db, B = CS.brand, C = CS.copy;
  const h = X.h;

  const app = { store: null, tab: 'today', params: {}, root: null, tabsEl: null, timerEl: null, statusEl: null, tickHandle: null, audio: null, renderQueued: false };

  app.today = function () { return U.localDate(Date.now(), app.store.db ? app.store.db.profile.timezone : U.defaultTz()); };

  app.navigate = function (tab, params) { app.tab = tab; app.params = params || {}; app.render(); window.scrollTo(0, 0); };

  app.startSession = function (templateId) {
    const active = D.findActiveSession(app.store.db);
    if (active && active.templateId !== templateId) { X.toast(active.templateName + ' ' + C.errors.open); app.navigate('train', { view: 'logger' }); return; }
    app.store.commit((d) => D.startSession(d, templateId, app.today(), new Date().toISOString()));
    app.navigate('train', { view: 'logger' });
  };

  app.haptic = function (pattern) {
    const s = app.store.db && app.store.db.settings;
    if (!s || !s.haptics || !navigator.vibrate) return;
    try { navigator.vibrate(pattern); } catch (e) { /* ignore */ }
  };

  app.applyTheme = function () {
    const t = app.store && app.store.db ? app.store.db.settings.theme : 'auto';
    if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--surface').trim() || '#0A1922');
  };

  app.render = function () {
    if (app.renderQueued) return;
    app.renderQueued = true;
    (window.requestAnimationFrame || setTimeout)(() => { app.renderQueued = false; app.renderNow(); });
  };

  app.renderNow = function () {
    const root = app.root;
    X.clear(root);
    const db = app.store.db;
    if (!db || !db.profile || !db.profile.onboarded) {
      app.tabsEl.hidden = true; app.timerEl.hidden = true;
      CS.onboarding.render(root, (input) => { app.store.set(D.createInitial(input, new Date().toISOString())); app.applyTheme(); app.navigate('today'); });
      return;
    }
    app.tabsEl.hidden = false;
    const scr = h('div.screen', { class: db.timer ? 'has-timer' : '' });
    scr.appendChild(h('div.topbar', h('div.brand', B.mark(24), h('span.small', { text: C.app })), app.statusEl));
    try {
      if (app.tab === 'today') CS.today.render(scr, app);
      else if (app.tab === 'train') CS.train.render(scr, app, app.params);
      else if (app.tab === 'settings') CS.settings.render(scr, app, app.params);
    } catch (e) {
      scr.appendChild(h('p.error', { text: String(e && e.message || e) }));
      console.error(e);
    }
    root.appendChild(scr);
    app.renderTabs(); app.renderTimer(); app.renderStatus(app.store.status);
  };

  app.renderTabs = function () {
    X.clear(app.tabsEl);
    const inner = h('div.inner', { role: 'tablist' });
    [['today', C.tabs.today, X.ICON.today], ['train', C.tabs.train, X.ICON.train], ['settings', C.tabs.settings, X.ICON.profile]].forEach(([id, label, icon]) => {
      inner.appendChild(h('button.tab', { role: 'tab', 'aria-current': app.tab === id ? 'page' : null, 'aria-label': label, onClick: () => app.navigate(id) }, X.svg(icon), h('span', { text: label })));
    });
    app.tabsEl.appendChild(inner);
  };

  app.renderTimer = function () { CS.train.renderTimer(app.timerEl, app); };

  app.renderStatus = function (st) {
    const el = app.statusEl;
    const mode = app.store.backend.mode;
    el.className = 'dot ' + (mode === 'memory' ? 'unavailable' : st.state);
    el.setAttribute('aria-label', mode === 'memory' ? C.status.off : st.state === 'saved' ? C.status.saved : st.state === 'saving' ? C.status.saving : st.state === 'error' ? C.status.error : C.status.unsaved);
    el.title = el.getAttribute('aria-label');
  };

  app.tick = function () {
    const db = app.store.db;
    if (!db) return;
    const active = D.findActiveSession(db);
    const el = document.getElementById('elapsed');
    if (el && active) el.textContent = U.fmtDuration(D.activeMs(active, Date.now())) + (active.status === 'paused' ? ' ⏸' : '');
    if (db.timer) {
      const st = D.restState(db, Date.now());
      const clock = document.getElementById('restclock');
      if (clock) clock.textContent = st.done ? C.logger.restDone : U.fmtClock(st.remainingSec);
      if (st.done && !db.timer.alerted) {
        app.store.commit((d) => { if (d.timer) d.timer.alerted = true; }, { silent: true });
        app.alert(); app.renderTimer(); CS.train.onRestDone(app);
      } else if (app.timerEl.hidden) app.renderTimer();
    } else if (!app.timerEl.hidden) app.renderTimer();
  };

  app.alert = function () {
    const s = app.store.db.settings;
    if (s.restVibrate && navigator.vibrate) { try { navigator.vibrate([180, 90, 180]); } catch (e) { /* ignore */ } }
    if (s.restSound) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        if (!app.audio) app.audio = new AC();
        const ctx = app.audio, t0 = ctx.currentTime;
        [0, 0.22].forEach((off) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = 880; g.gain.setValueAtTime(0.0001, t0 + off); g.gain.exponentialRampToValueAtTime(0.25, t0 + off + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.16); o.connect(g); g.connect(ctx.destination); o.start(t0 + off); o.stop(t0 + off + 0.18); });
      } catch (e) { /* ignore */ }
    }
  };

  app.resetAll = async function () { await app.store.clear(); app.tab = 'today'; app.params = {}; app.applyTheme(); app.renderNow(); };

  app.boot = async function () {
    app.root = document.getElementById('app'); app.tabsEl = document.getElementById('tabs'); app.timerEl = document.getElementById('timerbar');
    app.statusEl = h('button.dot', { type: 'button', role: 'status', onClick: () => X.toast(app.statusEl.title || '') });
    const backend = await CS.storage.detect();
    app.store = CS.storage.createStore(backend);
    app.store.onChange(() => app.render());
    app.store.onStatus((st) => app.renderStatus(st));
    try { await app.store.load(); } catch (e) { console.error(e); }
    app.applyTheme(); app.renderNow();
    if (backend.mode === 'memory') X.toast(C.status.off, 5000);
    app.tickHandle = setInterval(app.tick, 1000);
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(() => {});
    document.addEventListener('pointerdown', () => { try { const AC = window.AudioContext || window.webkitAudioContext; if (AC && !app.audio) app.audio = new AC(); if (app.audio && app.audio.state === 'suspended') app.audio.resume(); } catch (e) { /* ignore */ } }, { once: true, passive: true });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') app.store.flushSync(); else app.tick(); });
    window.addEventListener('pagehide', () => app.store.flushSync());
    window.addEventListener('beforeunload', () => app.store.flushSync());
  };

  CS.app = app;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', app.boot); else app.boot();
})();
